<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Fondo -->
  <rect width="960" height="420" fill="#1e1e2e" rx="12"/>

  <!-- Título -->
  <text x="480" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#cdd6f4">Anatomía de una tabla relacional</text>

  <!-- Nombre de la tabla -->
  <!-- tabla: x=150..810, ancho=660, columnas: 150|300|570|720|810 -->
  <rect x="150" y="60" width="660" height="36" rx="6" fill="#313244"/>
  <text x="480" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#89b4fa">books</text>
  <text x="152" y="84" font-size="11" fill="#6c7086">← nombre de la relación (tabla)</text>

  <!-- Encabezado (header / esquema) -->
  <rect x="150" y="96" width="660" height="36" fill="#45475a"/>
  <!-- Divisores de columnas: book_id 150-300 | book_title 300-570 | book_author 570-720 | book_year 720-810 -->
  <line x1="300" y1="96" x2="300" y2="132" stroke="#1e1e2e" stroke-width="1"/>
  <line x1="570" y1="96" x2="570" y2="132" stroke="#1e1e2e" stroke-width="1"/>
  <line x1="720" y1="96" x2="720" y2="132" stroke="#1e1e2e" stroke-width="1"/>
  <text x="225" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">book_id</text>
  <text x="435" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">book_title</text>
  <text x="645" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">book_author</text>
  <text x="765" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">book_year</text>

  <!-- Fila 1 -->
  <rect x="150" y="132" width="660" height="36" fill="#1e1e2e"/>
  <line x1="300" y1="132" x2="300" y2="168" stroke="#313244" stroke-width="1"/>
  <line x1="570" y1="132" x2="570" y2="168" stroke="#313244" stroke-width="1"/>
  <line x1="720" y1="132" x2="720" y2="168" stroke="#313244" stroke-width="1"/>
  <text x="225" y="155" text-anchor="middle" font-size="12" fill="#cdd6f4">1</text>
  <text x="435" y="155" text-anchor="middle" font-size="11" fill="#cdd6f4">Database Design for Mere Mortals</text>
  <text x="645" y="155" text-anchor="middle" font-size="12" fill="#cdd6f4">Michael Hernandez</text>
  <text x="765" y="155" text-anchor="middle" font-size="12" fill="#cdd6f4">2003</text>

  <!-- Fila 2 (resaltada) -->
  <rect x="150" y="168" width="660" height="36" fill="#313244"/>
  <line x1="300" y1="168" x2="300" y2="204" stroke="#45475a" stroke-width="1"/>
  <line x1="570" y1="168" x2="570" y2="204" stroke="#45475a" stroke-width="1"/>
  <line x1="720" y1="168" x2="720" y2="204" stroke="#45475a" stroke-width="1"/>
  <text x="225" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">2</text>
  <text x="435" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">Learning SQL</text>
  <text x="645" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">Alan Beaulieu</text>
  <text x="765" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">2020</text>

  <!-- Fila 3 -->
  <rect x="150" y="204" width="660" height="36" fill="#1e1e2e"/>
  <line x1="300" y1="204" x2="300" y2="240" stroke="#313244" stroke-width="1"/>
  <line x1="570" y1="204" x2="570" y2="240" stroke="#313244" stroke-width="1"/>
  <line x1="720" y1="204" x2="720" y2="240" stroke="#313244" stroke-width="1"/>
  <text x="225" y="227" text-anchor="middle" font-size="12" fill="#cdd6f4">3</text>
  <text x="435" y="227" text-anchor="middle" font-size="11" fill="#cdd6f4">SQL Performance Explained</text>
  <text x="645" y="227" text-anchor="middle" font-size="12" fill="#cdd6f4">Markus Winand</text>
  <text x="765" y="227" text-anchor="middle" font-size="12" fill="#cdd6f4">2012</text>

  <!-- Borde de la tabla -->
  <rect x="150" y="60" width="660" height="180" rx="6" fill="none" stroke="#585b70" stroke-width="1.5"/>

  <!-- Flechas y etiquetas explicativas -->

  <!-- Nombre de tabla (label izquierda — margen de 150px garantiza que no clippa) -->
  <line x1="150" y1="78" x2="118" y2="78" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="114" y="73" font-size="10" fill="#f38ba8" text-anchor="end">nombre de</text>
  <text x="114" y="85" font-size="10" fill="#f38ba8" text-anchor="end">la tabla</text>

  <!-- Encabezado / atributos -->
  <line x1="480" y1="96" x2="480" y2="76" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="490" y="72" font-size="10" fill="#a6e3a1">encabezado (atributos / columnas)</text>

  <!-- Flecha columna -->
  <line x1="225" y1="96" x2="225" y2="56" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="225" y="52" text-anchor="middle" font-size="10" fill="#89b4fa">columna (atributo)</text>

  <!-- Fila 2 resaltada + etiqueta (2 líneas para no clippar el borde derecho) -->
  <rect x="150" y="168" width="660" height="36" fill="none" stroke="#f9e2af" stroke-width="1.5" rx="2"/>
  <line x1="810" y1="186" x2="840" y2="186" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="844" y="183" font-size="10" fill="#f9e2af">fila (tupla /</text>
  <text x="844" y="196" font-size="10" fill="#f9e2af">registro)</text>

  <!-- Celda resaltada -->
  <rect x="570" y="168" width="150" height="36" fill="none" stroke="#cba6f7" stroke-width="1.5"/>
  <line x1="645" y1="204" x2="645" y2="264" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="615" y="278" font-size="10" fill="#cba6f7">celda</text>
  <text x="615" y="290" font-size="10" fill="#cba6f7">(valor atómico)</text>

  <!-- Leyenda (ancho 760 para cubrir las descripciones más largas) -->
  <rect x="150" y="268" width="760" height="132" rx="8" fill="#181825"/>
  <text x="530" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#89b4fa">Terminología: formal vs. coloquial</text>

  <text x="190" y="314" font-size="11" fill="#a6e3a1" font-weight="700">Término formal</text>
  <text x="410" y="314" font-size="11" fill="#cdd6f4" font-weight="700">Equivalente SQL</text>
  <text x="610" y="314" font-size="11" fill="#cdd6f4" font-weight="700">Descripción</text>
  <line x1="170" y1="318" x2="890" y2="318" stroke="#313244" stroke-width="1"/>

  <text x="190" y="336" font-size="11" fill="#a6e3a1">Relación</text>
  <text x="410" y="336" font-size="11" fill="#cdd6f4">Tabla</text>
  <text x="610" y="336" font-size="10" fill="#585b70">Estructura bidimensional con nombre</text>

  <text x="190" y="354" font-size="11" fill="#a6e3a1">Atributo</text>
  <text x="410" y="354" font-size="11" fill="#cdd6f4">Columna</text>
  <text x="610" y="354" font-size="10" fill="#585b70">Define qué dato almacena cada posición</text>

  <text x="190" y="372" font-size="11" fill="#a6e3a1">Tupla</text>
  <text x="410" y="372" font-size="11" fill="#cdd6f4">Fila / Registro</text>
  <text x="610" y="372" font-size="10" fill="#585b70">Un registro individual; debe ser único</text>

  <text x="190" y="390" font-size="11" fill="#a6e3a1">Dominio</text>
  <text x="410" y="390" font-size="11" fill="#cdd6f4">Tipo de dato</text>
  <text x="610" y="390" font-size="10" fill="#585b70">Conjunto de valores válidos para un atributo</text>
</svg>
