<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Fondo -->
  <rect width="780" height="420" fill="#1e1e2e" rx="12"/>

  <!-- Título -->
  <text x="390" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#cdd6f4">Anatomía de una tabla relacional</text>

  <!-- Nombre de la tabla -->
  <rect x="60" y="60" width="660" height="36" rx="6" fill="#313244"/>
  <text x="390" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#89b4fa">books</text>
  <text x="62" y="84" font-size="11" fill="#6c7086">← nombre de la relación (tabla)</text>

  <!-- Encabezado (header / esquema) -->
  <rect x="60" y="96" width="660" height="36" rx="0" fill="#45475a"/>
  <!-- Columnas del header -->
  <line x1="225" y1="96" x2="225" y2="132" stroke="#1e1e2e" stroke-width="1"/>
  <line x1="510" y1="96" x2="510" y2="132" stroke="#1e1e2e" stroke-width="1"/>
  <line x1="660" y1="96" x2="660" y2="132" stroke="#1e1e2e" stroke-width="1"/>
  <text x="142" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">id</text>
  <text x="367" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">title</text>
  <text x="585" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">author</text>
  <text x="715" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#a6e3a1">year</text>

  <!-- Fila 1 -->
  <rect x="60" y="132" width="660" height="36" fill="#1e1e2e"/>
  <line x1="225" y1="132" x2="225" y2="168" stroke="#313244" stroke-width="1"/>
  <line x1="510" y1="132" x2="510" y2="168" stroke="#313244" stroke-width="1"/>
  <line x1="660" y1="132" x2="660" y2="168" stroke="#313244" stroke-width="1"/>
  <text x="142" y="155" text-anchor="middle" font-size="12" fill="#cdd6f4">1</text>
  <text x="367" y="155" text-anchor="middle" font-size="12" fill="#cdd6f4">Database Design for Mere Mortals</text>
  <text x="585" y="155" text-anchor="middle" font-size="12" fill="#cdd6f4">Michael Hernandez</text>
  <text x="715" y="155" text-anchor="middle" font-size="12" fill="#cdd6f4">2003</text>

  <!-- Fila 2 (resaltada) -->
  <rect x="60" y="168" width="660" height="36" fill="#313244"/>
  <line x1="225" y1="168" x2="225" y2="204" stroke="#45475a" stroke-width="1"/>
  <line x1="510" y1="168" x2="510" y2="204" stroke="#45475a" stroke-width="1"/>
  <line x1="660" y1="168" x2="660" y2="204" stroke="#45475a" stroke-width="1"/>
  <text x="142" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">2</text>
  <text x="367" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">Learning SQL</text>
  <text x="585" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">Alan Beaulieu</text>
  <text x="715" y="191" text-anchor="middle" font-size="12" fill="#cdd6f4">2020</text>

  <!-- Fila 3 -->
  <rect x="60" y="204" width="660" height="36" fill="#1e1e2e"/>
  <line x1="225" y1="204" x2="225" y2="240" stroke="#313244" stroke-width="1"/>
  <line x1="510" y1="204" x2="510" y2="240" stroke="#313244" stroke-width="1"/>
  <line x1="660" y1="204" x2="660" y2="240" stroke="#313244" stroke-width="1"/>
  <text x="142" y="227" text-anchor="middle" font-size="12" fill="#cdd6f4">3</text>
  <text x="367" y="227" text-anchor="middle" font-size="12" fill="#cdd6f4">SQL Performance Explained</text>
  <text x="585" y="227" text-anchor="middle" font-size="12" fill="#cdd6f4">Markus Winand</text>
  <text x="715" y="227" text-anchor="middle" font-size="12" fill="#cdd6f4">2012</text>

  <!-- Borde de la tabla -->
  <rect x="60" y="60" width="660" height="180" rx="6" fill="none" stroke="#585b70" stroke-width="1.5"/>

  <!-- Flechas y etiquetas explicativas -->

  <!-- Nombre de tabla -->
  <line x1="60" y1="78" x2="40" y2="78" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="36" y="73" font-size="10" fill="#f38ba8" text-anchor="end">nombre de</text>
  <text x="36" y="85" font-size="10" fill="#f38ba8" text-anchor="end">la tabla</text>

  <!-- Encabezado / atributos -->
  <line x1="390" y1="96" x2="390" y2="76" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="440" y="72" font-size="10" fill="#a6e3a1">encabezado (atributos / columnas)</text>

  <!-- Flecha columna -->
  <line x1="142" y1="96" x2="142" y2="56" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="142" y="52" text-anchor="middle" font-size="10" fill="#89b4fa">columna (atributo)</text>

  <!-- Fila 2 resaltada + etiqueta -->
  <rect x="60" y="168" width="660" height="36" fill="none" stroke="#f9e2af" stroke-width="1.5" rx="2"/>
  <line x1="720" y1="186" x2="750" y2="186" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="754" y="190" font-size="10" fill="#f9e2af">fila (tupla / registro)</text>

  <!-- Celda resaltada -->
  <rect x="510" y="168" width="150" height="36" fill="none" stroke="#cba6f7" stroke-width="1.5"/>
  <line x1="585" y1="204" x2="585" y2="270" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="555" y="284" font-size="10" fill="#cba6f7">celda</text>
  <text x="555" y="296" font-size="10" fill="#cba6f7">(valor atómico)</text>

  <!-- Leyenda -->
  <rect x="60" y="270" width="660" height="130" rx="8" fill="#181825"/>
  <text x="390" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#89b4fa">Terminología: formal vs. coloquial</text>

  <text x="100" y="316" font-size="11" fill="#a6e3a1" font-weight="700">Término formal</text>
  <text x="340" y="316" font-size="11" fill="#cdd6f4" font-weight="700">Equivalente SQL</text>
  <text x="560" y="316" font-size="11" fill="#cdd6f4" font-weight="700">Descripción</text>
  <line x1="80" y1="320" x2="700" y2="320" stroke="#313244" stroke-width="1"/>

  <text x="100" y="338" font-size="11" fill="#a6e3a1">Relación</text>
  <text x="340" y="338" font-size="11" fill="#cdd6f4">Tabla</text>
  <text x="560" y="338" font-size="11" fill="#585b70">Estructura bidimensional con nombre</text>

  <text x="100" y="356" font-size="11" fill="#a6e3a1">Atributo</text>
  <text x="340" y="356" font-size="11" fill="#cdd6f4">Columna</text>
  <text x="560" y="356" font-size="11" fill="#585b70">Define qué dato almacena cada posición</text>

  <text x="100" y="374" font-size="11" fill="#a6e3a1">Tupla</text>
  <text x="340" y="374" font-size="11" fill="#cdd6f4">Fila / Registro</text>
  <text x="560" y="374" font-size="11" fill="#585b70">Un registro individual; debe ser único</text>

  <text x="100" y="392" font-size="11" fill="#a6e3a1">Dominio</text>
  <text x="340" y="392" font-size="11" fill="#cdd6f4">Tipo de dato</text>
  <text x="560" y="392" font-size="11" fill="#585b70">Conjunto de valores válidos para un atributo</text>
</svg>
