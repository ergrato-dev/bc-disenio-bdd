<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Fondo -->
  <rect width="820" height="460" fill="#1e1e2e" rx="12"/>

  <!-- Título -->
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#cdd6f4">Tipos de SGBD — Comparativa</text>

  <!-- ====== CARD 1: Relacional ====== -->
  <rect x="30" y="55" width="180" height="290" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <rect x="30" y="55" width="180" height="40" rx="10" fill="#89b4fa"/>
  <rect x="30" y="80" width="180" height="15" fill="#89b4fa"/>
  <text x="120" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1e2e">Relacional</text>
  <text x="120" y="108" text-anchor="middle" font-size="10" fill="#89dceb">PostgreSQL · MySQL</text>
  <text x="120" y="122" text-anchor="middle" font-size="10" fill="#89dceb">Oracle · SQL Server</text>
  <line x1="50" y1="132" x2="190" y2="132" stroke="#45475a" stroke-width="1"/>
  <text x="50" y="150" font-size="10" fill="#a6e3a1">✓ Esquema fijo (DDL)</text>
  <text x="50" y="166" font-size="10" fill="#a6e3a1">✓ ACID completo</text>
  <text x="50" y="182" font-size="10" fill="#a6e3a1">✓ JOINs complejos</text>
  <text x="50" y="198" font-size="10" fill="#a6e3a1">✓ SQL estándar</text>
  <text x="50" y="218" font-size="10" fill="#f38ba8">✗ Escala horiz. costosa</text>
  <line x1="50" y1="230" x2="190" y2="230" stroke="#45475a" stroke-width="1"/>
  <text x="120" y="248" text-anchor="middle" font-size="10" fill="#cdd6f4" font-weight="600">Mejor para:</text>
  <text x="120" y="264" text-anchor="middle" font-size="10" fill="#cdd6f4">Sistemas transaccionales</text>
  <text x="120" y="278" text-anchor="middle" font-size="10" fill="#cdd6f4">ERP, e-commerce, banca</text>
  <text x="120" y="295" text-anchor="middle" font-size="10" fill="#cdd6f4">Integridad crítica</text>
  <text x="120" y="320" text-anchor="middle" font-size="9" fill="#89b4fa" font-weight="700">OLTP ✓✓   OLAP ✓</text>

  <!-- ====== CARD 2: Documental ====== -->
  <rect x="230" y="55" width="180" height="290" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <rect x="230" y="55" width="180" height="40" rx="10" fill="#a6e3a1"/>
  <rect x="230" y="80" width="180" height="15" fill="#a6e3a1"/>
  <text x="320" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1e2e">Documental</text>
  <text x="320" y="108" text-anchor="middle" font-size="10" fill="#89dceb">MongoDB · CouchDB</text>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="#89dceb">Firestore · DynamoDB</text>
  <line x1="250" y1="132" x2="390" y2="132" stroke="#45475a" stroke-width="1"/>
  <text x="250" y="150" font-size="10" fill="#a6e3a1">✓ Esquema flexible</text>
  <text x="250" y="166" font-size="10" fill="#a6e3a1">✓ Escala horizontal nativa</text>
  <text x="250" y="182" font-size="10" fill="#a6e3a1">✓ JSON nativo</text>
  <text x="250" y="198" font-size="10" fill="#f38ba8">✗ JOINs costosos</text>
  <text x="250" y="218" font-size="10" fill="#f38ba8">✗ ACID limitado</text>
  <line x1="250" y1="230" x2="390" y2="230" stroke="#45475a" stroke-width="1"/>
  <text x="320" y="248" text-anchor="middle" font-size="10" fill="#cdd6f4" font-weight="600">Mejor para:</text>
  <text x="320" y="264" text-anchor="middle" font-size="10" fill="#cdd6f4">Catálogos variables</text>
  <text x="320" y="278" text-anchor="middle" font-size="10" fill="#cdd6f4">CMS, prototipos</text>
  <text x="320" y="295" text-anchor="middle" font-size="10" fill="#cdd6f4">Datos semiestructurados</text>
  <text x="320" y="320" text-anchor="middle" font-size="9" fill="#a6e3a1" font-weight="700">OLTP ✓   OLAP ✗</text>

  <!-- ====== CARD 3: Columnar ====== -->
  <rect x="430" y="55" width="180" height="290" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <rect x="430" y="55" width="180" height="40" rx="10" fill="#f9e2af"/>
  <rect x="430" y="80" width="180" height="15" fill="#f9e2af"/>
  <text x="520" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1e2e">Columnar</text>
  <text x="520" y="108" text-anchor="middle" font-size="10" fill="#89dceb">BigQuery · Redshift</text>
  <text x="520" y="122" text-anchor="middle" font-size="10" fill="#89dceb">ClickHouse · Parquet</text>
  <line x1="450" y1="132" x2="590" y2="132" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="150" font-size="10" fill="#a6e3a1">✓ Análisis masivos rápidos</text>
  <text x="450" y="166" font-size="10" fill="#a6e3a1">✓ Compresión excelente</text>
  <text x="450" y="182" font-size="10" fill="#a6e3a1">✓ Lee solo cols necesarias</text>
  <text x="450" y="198" font-size="10" fill="#f38ba8">✗ Escrituras lentas</text>
  <text x="450" y="218" font-size="10" fill="#f38ba8">✗ No para OLTP</text>
  <line x1="450" y1="230" x2="590" y2="230" stroke="#45475a" stroke-width="1"/>
  <text x="520" y="248" text-anchor="middle" font-size="10" fill="#cdd6f4" font-weight="600">Mejor para:</text>
  <text x="520" y="264" text-anchor="middle" font-size="10" fill="#cdd6f4">Data warehouses</text>
  <text x="520" y="278" text-anchor="middle" font-size="10" fill="#cdd6f4">Business intelligence</text>
  <text x="520" y="295" text-anchor="middle" font-size="10" fill="#cdd6f4">Analytics a escala</text>
  <text x="520" y="320" text-anchor="middle" font-size="9" fill="#f9e2af" font-weight="700">OLTP ✗   OLAP ✓✓</text>

  <!-- ====== CARD 4: Clave-Valor ====== -->
  <rect x="630" y="55" width="160" height="290" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <rect x="630" y="55" width="160" height="40" rx="10" fill="#cba6f7"/>
  <rect x="630" y="80" width="160" height="15" fill="#cba6f7"/>
  <text x="710" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1e2e">Clave-Valor</text>
  <text x="710" y="108" text-anchor="middle" font-size="10" fill="#89dceb">Redis · Memcached</text>
  <text x="710" y="122" text-anchor="middle" font-size="10" fill="#89dceb">DynamoDB (KV)</text>
  <line x1="650" y1="132" x2="770" y2="132" stroke="#45475a" stroke-width="1"/>
  <text x="650" y="150" font-size="10" fill="#a6e3a1">✓ Latencia mínima</text>
  <text x="650" y="166" font-size="10" fill="#a6e3a1">✓ Escala masiva</text>
  <text x="650" y="182" font-size="10" fill="#a6e3a1">✓ Simplicidad</text>
  <text x="650" y="198" font-size="10" fill="#f38ba8">✗ Sin consultas complejas</text>
  <text x="650" y="218" font-size="10" fill="#f38ba8">✗ Sin relaciones</text>
  <line x1="650" y1="230" x2="770" y2="230" stroke="#45475a" stroke-width="1"/>
  <text x="710" y="248" text-anchor="middle" font-size="10" fill="#cdd6f4" font-weight="600">Mejor para:</text>
  <text x="710" y="264" text-anchor="middle" font-size="10" fill="#cdd6f4">Caché de sesiones</text>
  <text x="710" y="278" text-anchor="middle" font-size="10" fill="#cdd6f4">Contadores en tiempo real</text>
  <text x="710" y="295" text-anchor="middle" font-size="10" fill="#cdd6f4">Colas de mensajes</text>
  <text x="710" y="320" text-anchor="middle" font-size="9" fill="#cba6f7" font-weight="700">OLTP (caché) ✓   OLAP ✗</text>

  <!-- ====== Eje del tiempo ====== -->
  <rect x="30" y="365" width="760" height="75" rx="8" fill="#181825"/>
  <text x="410" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#89b4fa">Línea de tiempo — evolución de los SGBD</text>

  <line x1="60" y1="420" x2="760" y2="420" stroke="#45475a" stroke-width="2"/>
  <!-- Puntos en la línea del tiempo -->
  <circle cx="110" cy="420" r="5" fill="#585b70"/>
  <circle cx="230" cy="420" r="5" fill="#89b4fa"/>
  <circle cx="370" cy="420" r="5" fill="#a6e3a1"/>
  <circle cx="500" cy="420" r="5" fill="#f38ba8"/>
  <circle cx="650" cy="420" r="5" fill="#f9e2af"/>
  <circle cx="760" cy="420" r="5" fill="#cba6f7"/>

  <text x="110" y="412" text-anchor="middle" font-size="9" fill="#585b70">1960s</text>
  <text x="110" y="438" text-anchor="middle" font-size="9" fill="#585b70">Jerárquico/Red</text>
  <text x="230" y="412" text-anchor="middle" font-size="9" fill="#89b4fa">1970</text>
  <text x="230" y="438" text-anchor="middle" font-size="9" fill="#89b4fa">Codd propone</text>
  <text x="230" y="449" text-anchor="middle" font-size="9" fill="#89b4fa">el modelo relacional</text>
  <text x="370" y="412" text-anchor="middle" font-size="9" fill="#a6e3a1">1986</text>
  <text x="370" y="438" text-anchor="middle" font-size="9" fill="#a6e3a1">SQL como</text>
  <text x="370" y="449" text-anchor="middle" font-size="9" fill="#a6e3a1">estándar ANSI</text>
  <text x="500" y="412" text-anchor="middle" font-size="9" fill="#f38ba8">1996</text>
  <text x="500" y="438" text-anchor="middle" font-size="9" fill="#f38ba8">Nace</text>
  <text x="500" y="449" text-anchor="middle" font-size="9" fill="#f38ba8">PostgreSQL</text>
  <text x="650" y="412" text-anchor="middle" font-size="9" fill="#f9e2af">2000s</text>
  <text x="650" y="438" text-anchor="middle" font-size="9" fill="#f9e2af">Auge NoSQL</text>
  <text x="760" y="412" text-anchor="middle" font-size="9" fill="#cba6f7">Hoy</text>
  <text x="760" y="438" text-anchor="middle" font-size="9" fill="#cba6f7">Coexistencia</text>
</svg>
