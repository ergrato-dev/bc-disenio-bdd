<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Fondo -->
  <rect width="900" height="580" fill="#1e1e2e" rx="12"/>

  <!-- Título -->
  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#cdd6f4">Anatomía de un SELECT</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#6c7086">Orden de escritura vs. orden de evaluación en PostgreSQL</text>

  <!-- ===== LADO IZQUIERDO: Bloque de SQL ===== -->
  <rect x="40" y="90" width="400" height="340" fill="#181825" rx="8" stroke="#313244" stroke-width="1.5"/>
  <text x="60" y="116" font-size="12" fill="#6c7086">Orden de escritura</text>

  <!-- Líneas SQL con color sintaxis -->
  <!-- SELECT -->
  <rect x="40" y="125" width="400" height="28" fill="#89b4fa" fill-opacity="0.12" rx="2"/>
  <text x="60" y="144" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">SELECT</text>
  <text x="130" y="144" font-size="14" font-family="monospace" fill="#cdd6f4">  id, name, price</text>
  <text x="370" y="144" font-size="11" fill="#6c7086" font-style="italic">← 5</text>

  <!-- FROM -->
  <rect x="40" y="155" width="400" height="28" fill="#a6e3a1" fill-opacity="0.10" rx="2"/>
  <text x="60" y="174" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">FROM</text>
  <text x="130" y="174" font-size="14" font-family="monospace" fill="#a6e3a1">    products</text>
  <text x="370" y="174" font-size="11" fill="#6c7086" font-style="italic">← 1</text>

  <!-- WHERE -->
  <rect x="40" y="185" width="400" height="28" fill="#f38ba8" fill-opacity="0.10" rx="2"/>
  <text x="60" y="204" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">WHERE</text>
  <text x="130" y="204" font-size="14" font-family="monospace" fill="#f38ba8">   category_id = 2</text>
  <text x="370" y="204" font-size="11" fill="#6c7086" font-style="italic">← 2</text>

  <!-- AND stock -->
  <rect x="40" y="213" width="400" height="28" fill="#f38ba8" fill-opacity="0.06" rx="2"/>
  <text x="60" y="232" font-size="14" font-family="monospace" fill="#6c7086"></text>
  <text x="72" y="232" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">AND</text>
  <text x="130" y="232" font-size="14" font-family="monospace" fill="#f38ba8">    stock &gt; 0</text>

  <!-- ORDER BY -->
  <rect x="40" y="243" width="400" height="28" fill="#fab387" fill-opacity="0.10" rx="2"/>
  <text x="60" y="262" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">ORDER BY</text>
  <text x="160" y="262" font-size="14" font-family="monospace" fill="#fab387">price ASC</text>
  <text x="370" y="262" font-size="11" fill="#6c7086" font-style="italic">← 6</text>

  <!-- LIMIT -->
  <rect x="40" y="273" width="400" height="28" fill="#f9e2af" fill-opacity="0.10" rx="2"/>
  <text x="60" y="292" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">LIMIT</text>
  <text x="130" y="292" font-size="14" font-family="monospace" fill="#f9e2af">   10</text>
  <text x="370" y="292" font-size="11" fill="#6c7086" font-style="italic">← 7</text>

  <!-- OFFSET -->
  <rect x="40" y="301" width="400" height="28" fill="#f9e2af" fill-opacity="0.06" rx="2"/>
  <text x="60" y="320" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">OFFSET</text>
  <text x="140" y="320" font-size="14" font-family="monospace" fill="#f9e2af">  20;</text>
  <text x="370" y="320" font-size="11" fill="#6c7086" font-style="italic">← 8</text>

  <!-- Nota alias -->
  <rect x="50" y="348" width="380" height="64" fill="#313244" rx="6"/>
  <text x="70" y="366" font-size="12" fill="#f9e2af" font-weight="600">⚠  Alias de SELECT</text>
  <text x="70" y="384" font-size="11" fill="#a6adc8">Los alias definidos en SELECT no pueden</text>
  <text x="70" y="400" font-size="11" fill="#a6adc8">usarse en WHERE ni en HAVING (se evalúan antes).</text>

  <!-- ===== LADO DERECHO: Orden de evaluación ===== -->
  <rect x="480" y="90" width="380" height="340" fill="#181825" rx="8" stroke="#313244" stroke-width="1.5"/>
  <text x="500" y="116" font-size="12" fill="#6c7086">Orden de evaluación del motor</text>

  <!-- Pasos numerados -->
  <!-- 1 FROM -->
  <rect x="496" y="122" width="348" height="36" fill="#a6e3a1" fill-opacity="0.15" rx="6"/>
  <circle cx="520" cy="140" r="12" fill="#a6e3a1"/>
  <text x="520" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e2e">1</text>
  <text x="544" y="145" font-size="14" font-family="monospace" fill="#a6e3a1" font-weight="700">FROM</text>
  <text x="630" y="145" font-size="12" fill="#a6adc8">Identifica tablas y aplica JOINs</text>

  <!-- 2 WHERE -->
  <rect x="496" y="164" width="348" height="36" fill="#f38ba8" fill-opacity="0.15" rx="6"/>
  <circle cx="520" cy="182" r="12" fill="#f38ba8"/>
  <text x="520" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e2e">2</text>
  <text x="544" y="187" font-size="14" font-family="monospace" fill="#f38ba8" font-weight="700">WHERE</text>
  <text x="630" y="187" font-size="12" fill="#a6adc8">Filtra filas individuales</text>

  <!-- 3 GROUP BY -->
  <rect x="496" y="206" width="348" height="36" fill="#89dceb" fill-opacity="0.15" rx="6"/>
  <circle cx="520" cy="224" r="12" fill="#89dceb"/>
  <text x="520" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e2e">3</text>
  <text x="544" y="229" font-size="14" font-family="monospace" fill="#89dceb" font-weight="700">GROUP BY</text>
  <text x="650" y="229" font-size="12" fill="#a6adc8">Agrupa filas</text>

  <!-- 4 HAVING -->
  <rect x="496" y="248" width="348" height="36" fill="#cba6f7" fill-opacity="0.15" rx="6"/>
  <circle cx="520" cy="266" r="12" fill="#cba6f7"/>
  <text x="520" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e2e">4</text>
  <text x="544" y="271" font-size="14" font-family="monospace" fill="#cba6f7" font-weight="700">HAVING</text>
  <text x="630" y="271" font-size="12" fill="#a6adc8">Filtra grupos (post-agregación)</text>

  <!-- 5 SELECT -->
  <rect x="496" y="290" width="348" height="36" fill="#89b4fa" fill-opacity="0.25" rx="6" stroke="#89b4fa" stroke-width="1.5"/>
  <circle cx="520" cy="308" r="12" fill="#89b4fa"/>
  <text x="520" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e2e">5</text>
  <text x="544" y="313" font-size="14" font-family="monospace" fill="#89b4fa" font-weight="700">SELECT</text>
  <text x="630" y="313" font-size="12" fill="#a6adc8">Proyecta columnas y alias</text>

  <!-- 6 ORDER BY -->
  <rect x="496" y="332" width="348" height="36" fill="#fab387" fill-opacity="0.15" rx="6"/>
  <circle cx="520" cy="350" r="12" fill="#fab387"/>
  <text x="520" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e2e">6</text>
  <text x="544" y="355" font-size="14" font-family="monospace" fill="#fab387" font-weight="700">ORDER BY</text>
  <text x="650" y="355" font-size="12" fill="#a6adc8">Ordena el resultado</text>

  <!-- 7-8 LIMIT/OFFSET -->
  <rect x="496" y="374" width="348" height="36" fill="#f9e2af" fill-opacity="0.15" rx="6"/>
  <circle cx="520" cy="392" r="12" fill="#f9e2af"/>
  <text x="520" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1e2e">7</text>
  <text x="544" y="392" font-size="14" font-family="monospace" fill="#f9e2af" font-weight="700">LIMIT / OFFSET</text>
  <text x="700" y="392" font-size="12" fill="#a6adc8">Pagina el resultado</text>

  <!-- ===== SECCIÓN INFERIOR: tabla de paginación ===== -->
  <rect x="40" y="450" width="820" height="110" fill="#181825" rx="8" stroke="#313244" stroke-width="1.5"/>
  <text x="450" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#cdd6f4">Fórmula de paginación: OFFSET = (página − 1) × tamaño</text>

  <!-- Tabla de ejemplo -->
  <text x="120" y="498" text-anchor="middle" font-size="12" fill="#89b4fa" font-weight="600">Página</text>
  <text x="280" y="498" text-anchor="middle" font-size="12" fill="#89b4fa" font-weight="600">LIMIT</text>
  <text x="440" y="498" text-anchor="middle" font-size="12" fill="#89b4fa" font-weight="600">OFFSET</text>
  <text x="650" y="498" text-anchor="middle" font-size="12" fill="#89b4fa" font-weight="600">Filas devueltas (de 100 totales)</text>
  <line x1="56" y1="502" x2="844" y2="502" stroke="#313244" stroke-width="1"/>

  <text x="120" y="520" text-anchor="middle" font-size="12" fill="#cdd6f4">1</text>
  <text x="280" y="520" text-anchor="middle" font-size="12" fill="#cdd6f4">10</text>
  <text x="440" y="520" text-anchor="middle" font-size="12" fill="#cdd6f4">0</text>
  <text x="650" y="520" text-anchor="middle" font-size="12" fill="#a6adc8">1 – 10</text>

  <text x="120" y="540" text-anchor="middle" font-size="12" fill="#cdd6f4">2</text>
  <text x="280" y="540" text-anchor="middle" font-size="12" fill="#cdd6f4">10</text>
  <text x="440" y="540" text-anchor="middle" font-size="12" fill="#cdd6f4">10</text>
  <text x="650" y="540" text-anchor="middle" font-size="12" fill="#a6adc8">11 – 20</text>

  <text x="120" y="560" text-anchor="middle" font-size="12" fill="#cdd6f4">5</text>
  <text x="280" y="560" text-anchor="middle" font-size="12" fill="#cdd6f4">10</text>
  <text x="440" y="560" text-anchor="middle" font-size="12" fill="#cdd6f4">40</text>
  <text x="650" y="560" text-anchor="middle" font-size="12" fill="#a6adc8">41 – 50</text>
</svg>
