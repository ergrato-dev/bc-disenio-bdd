<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <!-- Background -->
  <rect width="900" height="540" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Inter,Roboto,system-ui,sans-serif" font-size="17" font-weight="bold" fill="#cdd6f4" text-anchor="middle">ER Ejemplo Completo — Sistema de Reservas de Hotel</text>
  <text x="450" y="54" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" fill="#9399b2" text-anchor="middle">Notación Crow's Foot · 4 entidades · 3 relaciones</text>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- Entities                                                          -->
  <!--   HOTEL (top-left)   HABITACION (top-right)                      -->
  <!--   HUESPED (bot-left) RESERVA (bot-right)                         -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- HOTEL -->
  <rect x="60" y="100" width="200" height="130" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <rect x="60" y="100" width="200" height="32" rx="6" fill="#45475a"/>
  <rect x="60" y="118" width="200" height="14" rx="0" fill="#45475a"/>
  <text x="160" y="121" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">HOTEL</text>
  <text x="75" y="150" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">🔑 id</text>
  <text x="75" y="167" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   nombre</text>
  <text x="75" y="184" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   ciudad</text>
  <text x="75" y="201" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   categoria</text>
  <text x="75" y="218" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   telefono</text>

  <!-- HABITACION -->
  <rect x="640" y="100" width="210" height="145" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <rect x="640" y="100" width="210" height="32" rx="6" fill="#45475a"/>
  <rect x="640" y="118" width="210" height="14" rx="0" fill="#45475a"/>
  <text x="745" y="121" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">HABITACION</text>
  <text x="655" y="150" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">🔑 id</text>
  <text x="655" y="167" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1">🔗 hotel_id</text>
  <text x="655" y="184" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   numero</text>
  <text x="655" y="201" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   tipo</text>
  <text x="655" y="218" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   precio_noche</text>
  <text x="655" y="235" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   capacidad</text>

  <!-- HUESPED -->
  <rect x="60" y="360" width="200" height="130" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <rect x="60" y="360" width="200" height="32" rx="6" fill="#45475a"/>
  <rect x="60" y="378" width="200" height="14" rx="0" fill="#45475a"/>
  <text x="160" y="381" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">HUESPED</text>
  <text x="75" y="410" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">🔑 id</text>
  <text x="75" y="427" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   nombre</text>
  <text x="75" y="444" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   email</text>
  <text x="75" y="461" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   telefono</text>
  <text x="75" y="478" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   pais</text>

  <!-- RESERVA -->
  <rect x="620" y="360" width="230" height="155" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <rect x="620" y="360" width="230" height="32" rx="6" fill="#45475a"/>
  <rect x="620" y="378" width="230" height="14" rx="0" fill="#45475a"/>
  <text x="735" y="381" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">RESERVA</text>
  <text x="635" y="410" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">🔑 id</text>
  <text x="635" y="427" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1">🔗 huesped_id</text>
  <text x="635" y="444" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1">🔗 habitacion_id</text>
  <text x="635" y="461" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   fecha_entrada</text>
  <text x="635" y="478" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   fecha_salida</text>
  <text x="635" y="495" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">   estado · total</text>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- Relationships                                                     -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- REL 1: HOTEL ||——|< HABITACION (horizontal top) -->
  <line x1="260" y1="165" x2="640" y2="165" stroke="#89b4fa" stroke-width="2"/>
  <!-- Label -->
  <text x="450" y="158" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle" font-style="italic">tiene</text>
  <!-- || at HOTEL end (right) -->
  <line x1="272" y1="155" x2="272" y2="175" stroke="#f9e2af" stroke-width="2.5"/>
  <line x1="280" y1="155" x2="280" y2="175" stroke="#f9e2af" stroke-width="2.5"/>
  <!-- |< at HABITACION end (left) — bar + crow's foot -->
  <line x1="628" y1="155" x2="628" y2="175" stroke="#f9e2af" stroke-width="2.5"/>
  <line x1="608" y1="165" x2="622" y2="165" stroke="#f9e2af" stroke-width="2"/>
  <line x1="608" y1="165" x2="622" y2="155" stroke="#f9e2af" stroke-width="2"/>
  <line x1="608" y1="165" x2="622" y2="175" stroke="#f9e2af" stroke-width="2"/>
  <!-- Notation text -->
  <text x="296" y="161" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">||</text>
  <text x="575" y="161" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">|&lt;</text>

  <!-- REL 2: HUESPED ||——o< RESERVA (horizontal bottom) -->
  <line x1="260" y1="425" x2="620" y2="425" stroke="#89b4fa" stroke-width="2"/>
  <text x="440" y="418" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle" font-style="italic">realiza</text>
  <!-- || at HUESPED end (right) -->
  <line x1="272" y1="415" x2="272" y2="435" stroke="#f9e2af" stroke-width="2.5"/>
  <line x1="280" y1="415" x2="280" y2="435" stroke="#f9e2af" stroke-width="2.5"/>
  <!-- o< at RESERVA end (left) -->
  <circle cx="608" cy="425" r="7" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2"/>
  <line x1="588" y1="425" x2="600" y2="425" stroke="#f9e2af" stroke-width="2"/>
  <line x1="588" y1="425" x2="600" y2="415" stroke="#f9e2af" stroke-width="2"/>
  <line x1="588" y1="425" x2="600" y2="435" stroke="#f9e2af" stroke-width="2"/>
  <!-- Notation text -->
  <text x="296" y="421" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">||</text>
  <text x="555" y="421" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">○&lt;</text>

  <!-- REL 3: HABITACION ||——o< RESERVA (vertical right) -->
  <line x1="745" y1="245" x2="745" y2="360" stroke="#89b4fa" stroke-width="2"/>
  <text x="760" y="305" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" font-style="italic">aparece en</text>
  <!-- || at HABITACION end (bottom) -->
  <line x1="733" y1="257" x2="757" y2="257" stroke="#f9e2af" stroke-width="2.5"/>
  <line x1="733" y1="265" x2="757" y2="265" stroke="#f9e2af" stroke-width="2.5"/>
  <!-- o< at RESERVA end (top) -->
  <circle cx="745" cy="348" r="7" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2"/>
  <line x1="745" y1="328" x2="745" y2="341" stroke="#f9e2af" stroke-width="2"/>
  <line x1="745" y1="328" x2="735" y2="341" stroke="#f9e2af" stroke-width="2"/>
  <line x1="745" y1="328" x2="755" y2="341" stroke="#f9e2af" stroke-width="2"/>

  <!-- Notation text vertical rel -->
  <text x="758" y="278" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">||</text>
  <text x="756" y="330" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">○&lt;</text>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- Legend / Key                                                      -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <rect x="15" y="508" width="870" height="24" rx="4" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="25" y="524" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">🔑 PK</text>
  <text x="60" y="524" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2"> clave primaria</text>
  <text x="180" y="524" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1">🔗 FK</text>
  <text x="210" y="524" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2"> clave foránea</text>
  <text x="360" y="524" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2">|| exactamente uno (obligatorio)</text>
  <text x="590" y="524" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2">|&lt; uno o muchos · ○&lt; cero o muchos</text>
</svg>
