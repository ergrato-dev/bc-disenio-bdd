<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <!-- Background -->
  <rect width="900" height="540" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Inter,Roboto,system-ui,sans-serif" font-size="17" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Atributo Multivaluado &#8594; Tabla Separada</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LEFT SIDE: Conceptual ER (Chen notation)                      -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <text x="215" y="62" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#9399b2" text-anchor="middle">Modelo Conceptual (Chen)</text>

  <!-- Entity: PRODUCT -->
  <rect x="90" y="75" width="150" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="165" y="106" font-family="Inter,Roboto,system-ui,sans-serif" font-size="15" font-weight="bold" fill="#89b4fa" text-anchor="middle">PRODUCT</text>

  <!-- Attribute: id (key) -->
  <ellipse cx="105" cy="200" rx="38" ry="20" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="105" y="204" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" fill="#f9e2af" text-anchor="middle" text-decoration="underline">id</text>
  <line x1="105" y1="180" x2="130" y2="125" stroke="#585b70" stroke-width="1.5"/>

  <!-- Attribute: name -->
  <ellipse cx="165" cy="210" rx="36" ry="20" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="165" y="214" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" fill="#a6e3a1" text-anchor="middle">name</text>
  <line x1="165" y1="190" x2="165" y2="125" stroke="#585b70" stroke-width="1.5"/>

  <!-- Attribute: tags (multivalued) — double oval -->
  <ellipse cx="250" cy="200" rx="38" ry="22" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <ellipse cx="250" cy="200" rx="30" ry="14" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="250" y="204" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" fill="#cba6f7" text-anchor="middle">tags</text>
  <line x1="234" y1="178" x2="210" y2="125" stroke="#585b70" stroke-width="1.5"/>

  <!-- Note: multivalued indicator -->
  <rect x="210" y="232" width="120" height="28" rx="4" fill="#181825" stroke="#cba6f7" stroke-width="1"/>
  <text x="270" y="250" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cba6f7" text-anchor="middle">&#8635; multivaluado</text>

  <!-- Problem annotation -->
  <rect x="60" y="270" width="300" height="48" rx="6" fill="#1a1a2e" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="210" y="291" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#f38ba8" text-anchor="middle">&#10007; No es posible en una sola columna</text>
  <text x="210" y="308" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">Viola la Primera Forma Normal (1FN)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CENTER ARROW                                                   -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <text x="450" y="175" font-family="Inter,Roboto,system-ui,sans-serif" font-size="28" fill="#f9e2af" text-anchor="middle">&#8594;</text>
  <text x="450" y="198" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">transformaci&#243;n</text>
  <text x="450" y="213" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">al modelo f&#237;sico</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- RIGHT SIDE: Physical model (two tables)                       -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <text x="685" y="62" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#9399b2" text-anchor="middle">Modelo F&#237;sico (tablas)</text>

  <!-- Table: products -->
  <rect x="530" y="74" width="200" height="130" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <!-- Header -->
  <rect x="530" y="74" width="200" height="30" rx="6" fill="#45475a"/>
  <rect x="530" y="96" width="200" height="8" fill="#45475a"/>
  <text x="630" y="94" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">products</text>
  <!-- Rows -->
  <line x1="530" y1="120" x2="730" y2="120" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="115" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">&#128273; id</text>
  <text x="680" y="115" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">bigint PK</text>
  <line x1="530" y1="136" x2="730" y2="136" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="131" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">name</text>
  <text x="680" y="131" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">varchar(100)</text>
  <line x1="530" y1="152" x2="730" y2="152" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="147" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">price</text>
  <text x="680" y="147" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">numeric(10,2)</text>
  <line x1="530" y1="168" x2="730" y2="168" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="163" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">created_at</text>
  <text x="680" y="163" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">timestamptz</text>
  <line x1="530" y1="184" x2="730" y2="184" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="197" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" font-style="italic">sin columna &#171;tags&#187;</text>

  <!-- FK Arrow -->
  <line x1="630" y1="204" x2="630" y2="238" stroke="#cba6f7" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Arrow head -->
  <polygon points="625,238 635,238 630,248" fill="#cba6f7"/>
  <text x="665" y="224" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cba6f7">1 : N</text>

  <!-- Table: product_tags -->
  <rect x="530" y="250" width="200" height="130" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <!-- Header -->
  <rect x="530" y="250" width="200" height="30" rx="6" fill="#3d2d5a"/>
  <rect x="530" y="272" width="200" height="8" fill="#3d2d5a"/>
  <text x="630" y="270" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#cba6f7" text-anchor="middle">product_tags</text>
  <!-- Rows -->
  <line x1="530" y1="296" x2="730" y2="296" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="291" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5">&#128279; product_id</text>
  <text x="680" y="291" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">bigint FK+PK</text>
  <line x1="530" y1="312" x2="730" y2="312" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="307" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">&#128273; tag</text>
  <text x="680" y="307" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">varchar(50) PK</text>
  <line x1="530" y1="328" x2="730" y2="328" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="344" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" font-style="italic">PRIMARY KEY (product_id, tag)</text>
  <line x1="530" y1="354" x2="730" y2="354" stroke="#45475a" stroke-width="1"/>
  <text x="545" y="368" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" font-style="italic">ON DELETE CASCADE &#x2713;</text>

  <!-- Solution annotation -->
  <rect x="530" y="396" width="200" height="48" rx="6" fill="#1a2e1a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="630" y="417" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">&#10003; Cumple 1FN</text>
  <text x="630" y="434" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">Indexable &#183; Consultable &#183; Escalable</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Footer                                                        -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="0" y="510" width="900" height="30" fill="#181825"/>
  <text x="450" y="529" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="middle">&#128273; clave primaria &#160;&#183;&#160; &#128279; clave for&#225;nea &#160;&#183;&#160; &#8635; atributo multivaluado &#160;&#183;&#160; PK compuesta: (product_id, tag)</text>
</svg>
