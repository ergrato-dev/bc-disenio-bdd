<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <!-- Background -->
  <rect width="900" height="520" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Inter,Roboto,system-ui,sans-serif" font-size="17" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Relaci&#243;n Ternaria: SUPPLIER &#8212; PRODUCT &#8212; PROJECT</text>
  <text x="450" y="54" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" fill="#9399b2" text-anchor="middle">Notaci&#243;n Chen &#183; Un proveedor suministra un producto a un proyecto</text>

  <!-- ═══════════════ Entity: SUPPLIER (top-left) ═══════════════ -->
  <rect x="50" y="90" width="160" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="130" y="121" font-family="Inter,Roboto,system-ui,sans-serif" font-size="15" font-weight="bold" fill="#89b4fa" text-anchor="middle">SUPPLIER</text>
  <!-- Attribute: id (key) -->
  <ellipse cx="85" cy="55" rx="44" ry="16" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="85" y="59" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af" text-anchor="middle" text-decoration="underline">supplier_id</text>
  <line x1="95" y1="70" x2="105" y2="90" stroke="#585b70" stroke-width="1.5"/>
  <!-- Attribute: name -->
  <ellipse cx="55" cy="152" rx="54" ry="17" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="55" y="156" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">supplier_name</text>
  <line x1="78" y1="145" x2="90" y2="135" stroke="#585b70" stroke-width="1.5"/>

  <!-- ═══════════════ Entity: PRODUCT (top-right) ═══════════════ -->
  <rect x="690" y="90" width="160" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="770" y="121" font-family="Inter,Roboto,system-ui,sans-serif" font-size="15" font-weight="bold" fill="#89b4fa" text-anchor="middle">PRODUCT</text>
  <!-- Attribute: id (key) -->
  <ellipse cx="815" cy="55" rx="42" ry="16" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="815" y="59" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af" text-anchor="middle" text-decoration="underline">product_id</text>
  <line x1="805" y1="70" x2="795" y2="90" stroke="#585b70" stroke-width="1.5"/>
  <!-- Attribute: name -->
  <ellipse cx="845" cy="152" rx="50" ry="17" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="845" y="156" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">product_name</text>
  <line x1="822" y1="145" x2="810" y2="135" stroke="#585b70" stroke-width="1.5"/>

  <!-- ═══════════════ Entity: PROJECT (bottom-center) ═══════════════ -->
  <rect x="370" y="390" width="160" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="450" y="421" font-family="Inter,Roboto,system-ui,sans-serif" font-size="15" font-weight="bold" fill="#89b4fa" text-anchor="middle">PROJECT</text>
  <!-- Attribute: id (key) -->
  <ellipse cx="368" cy="460" rx="40" ry="16" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="368" y="464" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af" text-anchor="middle" text-decoration="underline">project_id</text>
  <line x1="378" y1="448" x2="390" y2="440" stroke="#585b70" stroke-width="1.5"/>
  <!-- Attribute: name -->
  <ellipse cx="532" cy="460" rx="50" ry="16" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="532" y="464" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">project_name</text>
  <line x1="514" y1="448" x2="510" y2="440" stroke="#585b70" stroke-width="1.5"/>

  <!-- ═══════════════ Ternary Relationship Diamond (center) ═══════════════ -->
  <!-- Diamond centered at 450, 250 -->
  <polygon points="450,196 540,250 450,304 360,250" fill="#2d2d3e" stroke="#fab387" stroke-width="2.5"/>
  <text x="450" y="246" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#fab387" text-anchor="middle">supplies</text>
  <text x="450" y="264" font-family="Inter,Roboto,system-ui,sans-serif" font-size="10" fill="#9399b2" text-anchor="middle">(ternaria)</text>

  <!-- ═══════════════ Relationship attributes ═══════════════ -->
  <!-- quantity attribute on diamond -->
  <ellipse cx="330" cy="200" rx="38" ry="17" fill="#313244" stroke="#94e2d5" stroke-width="1.5"/>
  <text x="330" y="204" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5" text-anchor="middle">quantity</text>
  <line x1="362" y1="206" x2="380" y2="224" stroke="#585b70" stroke-width="1.5" stroke-dasharray="4,3"/>

  <ellipse cx="570" cy="200" rx="42" ry="17" fill="#313244" stroke="#94e2d5" stroke-width="1.5"/>
  <text x="570" y="204" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5" text-anchor="middle">supply_date</text>
  <line x1="538" y1="206" x2="520" y2="224" stroke="#585b70" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══════════════ Connecting lines: entities → diamond ═══════════════ -->
  <!-- SUPPLIER → diamond (left) -->
  <line x1="210" y1="115" x2="360" y2="250" stroke="#6c7086" stroke-width="2"/>
  <!-- PRODUCT → diamond (right) -->
  <line x1="690" y1="115" x2="540" y2="250" stroke="#6c7086" stroke-width="2"/>
  <!-- PROJECT → diamond (bottom) -->
  <line x1="450" y1="390" x2="450" y2="304" stroke="#6c7086" stroke-width="2"/>

  <!-- Cardinality labels on lines -->
  <!-- SUPPLIER side: N (o<) -->
  <text x="260" y="160" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">N</text>
  <!-- PRODUCT side: N (o<) -->
  <text x="630" y="160" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">N</text>
  <!-- PROJECT side: N (o<) -->
  <text x="462" y="370" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">N</text>

  <!-- ═══════════════ Physical table (bottom-right info panel) ═══════════════ -->
  <rect x="620" y="310" width="256" height="160" rx="6" fill="#181825" stroke="#fab387" stroke-width="1.5"/>
  <rect x="620" y="310" width="256" height="26" rx="6" fill="#2d2420"/>
  <rect x="620" y="328" width="256" height="8" fill="#2d2420"/>
  <text x="748" y="328" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#fab387" text-anchor="middle">supplies (tabla f&#237;sica)</text>
  <line x1="620" y1="352" x2="876" y2="352" stroke="#45475a" stroke-width="1"/>
  <text x="634" y="347" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5">&#128279; supplier_id</text>
  <text x="868" y="347" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">uuid FK+PK</text>
  <line x1="620" y1="368" x2="876" y2="368" stroke="#45475a" stroke-width="1"/>
  <text x="634" y="363" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5">&#128279; product_id</text>
  <text x="868" y="363" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">uuid FK+PK</text>
  <line x1="620" y1="384" x2="876" y2="384" stroke="#45475a" stroke-width="1"/>
  <text x="634" y="379" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5">&#128279; project_id</text>
  <text x="868" y="379" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">uuid FK+PK</text>
  <line x1="620" y1="400" x2="876" y2="400" stroke="#45475a" stroke-width="1"/>
  <text x="634" y="395" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">supply_quantity</text>
  <text x="868" y="395" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">integer</text>
  <line x1="620" y1="416" x2="876" y2="416" stroke="#45475a" stroke-width="1"/>
  <text x="634" y="411" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">supply_date</text>
  <text x="868" y="411" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">date</text>
  <line x1="620" y1="432" x2="876" y2="432" stroke="#45475a" stroke-width="1"/>
  <text x="748" y="456" font-family="Inter,Roboto,system-ui,sans-serif" font-size="10" fill="#f9e2af" text-anchor="middle">PK (supplier_id, product_id, project_id)</text>

  <!-- Footer -->
  <rect x="0" y="490" width="900" height="30" fill="#181825"/>
  <text x="450" y="509" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="middle">&#9670; rombo = relaci&#243;n ternaria &#160;&#183;&#160; N = muchos &#160;&#183;&#160; atributos en l&#237;nea discontinua = atributos propios de la relaci&#243;n &#160;&#183;&#160; PK ternaria = 3 FKs</text>
</svg>
