<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <!-- Background -->
  <rect width="900" height="560" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Inter,Roboto,system-ui,sans-serif" font-size="17" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Entidad Asociativa: N:M con atributos &#8594; Entidad propia</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- BEFORE: simple N:M relation (left panel)       -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="0" y="52" width="420" height="280" fill="#181825" rx="0"/>
  <text x="210" y="74" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#9399b2" text-anchor="middle">ANTES: Relaci&#243;n N:M simple</text>

  <!-- Entity: STUDENT -->
  <rect x="30" y="88" width="140" height="48" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="100" y="118" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">STUDENT</text>

  <!-- Entity: COURSE -->
  <rect x="250" y="88" width="140" height="48" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="320" y="118" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">COURSE</text>

  <!-- N:M line -->
  <line x1="170" y1="112" x2="250" y2="112" stroke="#6c7086" stroke-width="2"/>
  <text x="210" y="105" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle" font-style="italic">takes</text>
  <!-- Symbol LEFT (o<) at STUDENT right -->
  <circle cx="176" cy="112" r="6" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="186" y1="112" x2="194" y2="112" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="186" y1="112" x2="194" y2="105" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="186" y1="112" x2="194" y2="119" stroke="#f9e2af" stroke-width="1.5"/>
  <!-- Symbol RIGHT (o<) at COURSE left -->
  <circle cx="244" cy="112" r="6" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="234" y1="112" x2="226" y2="112" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="234" y1="112" x2="226" y2="105" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="234" y1="112" x2="226" y2="119" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="200" y="126" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">o&lt;&#160;&#160;&#160;&#160;o&lt;</text>

  <!-- Problem: N:M has attributes -->
  <rect x="30" y="158" width="360" height="80" rx="6" fill="#2d1a1a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="210" y="180" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#f38ba8" text-anchor="middle">Problema: la relaci&#243;n tiene atributos propios</text>
  <text x="210" y="198" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">enrollment_date: &#191;de qui&#233;n es? &#191;del estudiante? &#191;del curso?</text>
  <text x="210" y="214" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">final_grade: pertenece a la combinaci&#243;n espec&#237;fica</text>
  <text x="210" y="230" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">status: &#191;otros objetos referencian esta inscripci&#243;n?</text>

  <!-- Physical table BEFORE (pivot simple) -->
  <rect x="30" y="252" width="360" height="68" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <rect x="30" y="252" width="360" height="26" rx="6" fill="#45475a"/>
  <rect x="30" y="270" width="360" height="8" fill="#45475a"/>
  <text x="210" y="270" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#9399b2" text-anchor="middle">student_courses (tabla pivote simple)</text>
  <line x1="30" y1="294" x2="390" y2="294" stroke="#45475a" stroke-width="1"/>
  <text x="45" y="289" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5">student_id &#183; course_id</text>
  <text x="375" y="289" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">FK+PK</text>
  <text x="45" y="309" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f38ba8" font-style="italic">&#191;D&#243;nde van enrollment_date, final_grade, status?</text>

  <!-- CENTER ARROW -->
  <text x="450" y="260" font-family="Inter,Roboto,system-ui,sans-serif" font-size="28" fill="#f9e2af" text-anchor="middle">&#8594;</text>
  <text x="450" y="284" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">promover a</text>
  <text x="450" y="299" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">entidad</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- AFTER: associative entity (right panel)        -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="480" y="52" width="420" height="280" fill="#181825" rx="0"/>
  <text x="690" y="74" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">DESPU&#201;S: Entidad Asociativa</text>

  <!-- Entity: STUDENT -->
  <rect x="496" y="88" width="130" height="48" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="561" y="118" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">STUDENT</text>

  <!-- Entity: COURSE -->
  <rect x="756" y="88" width="130" height="48" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="821" y="118" font-family="Inter,Roboto,system-ui,sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">COURSE</text>

  <!-- Associative entity: ENROLLMENT (center) with special border -->
  <rect x="610" y="188" width="160" height="110" rx="6" fill="#1a2d1a" stroke="#a6e3a1" stroke-width="2.5"/>
  <rect x="614" y="192" width="152" height="102" rx="4" fill="none" stroke="#a6e3a1" stroke-width="1"/>
  <!-- Header -->
  <rect x="610" y="188" width="160" height="26" rx="6" fill="#1a3d1a"/>
  <rect x="610" y="206" width="160" height="8" fill="#1a3d1a"/>
  <text x="690" y="205" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">ENROLLMENT</text>
  <line x1="610" y1="230" x2="770" y2="230" stroke="#45475a" stroke-width="1"/>
  <text x="624" y="225" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">&#128273; id</text>
  <text x="762" y="225" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">bigint PK</text>
  <line x1="610" y1="244" x2="770" y2="244" stroke="#45475a" stroke-width="1"/>
  <text x="624" y="239" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5">&#128279; student_id</text>
  <text x="762" y="239" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">FK</text>
  <line x1="610" y1="258" x2="770" y2="258" stroke="#45475a" stroke-width="1"/>
  <text x="624" y="253" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#94e2d5">&#128279; course_id</text>
  <text x="762" y="253" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">FK</text>
  <line x1="610" y1="272" x2="770" y2="272" stroke="#45475a" stroke-width="1"/>
  <text x="624" y="267" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">enrollment_date</text>
  <text x="762" y="267" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">date</text>
  <line x1="610" y1="286" x2="770" y2="286" stroke="#45475a" stroke-width="1"/>
  <text x="624" y="281" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#cdd6f4">final_grade</text>
  <text x="762" y="281" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="end">numeric(4,2)</text>

  <!-- Lines: STUDENT → ENROLLMENT and ENROLLMENT → COURSE -->
  <!-- STUDENT → ENROLLMENT -->
  <line x1="626" y1="136" x2="645" y2="188" stroke="#6c7086" stroke-width="2"/>
  <!-- Symbol at STUDENT end: o< -->
  <line x1="626" y1="136" x2="626" y2="144" stroke="#f9e2af" stroke-width="1.5"/>
  <!-- Symbol at ENROLLMENT end: || -->
  <line x1="639" y1="182" x2="633" y2="182" stroke="#f9e2af" stroke-width="2"/>
  <line x1="638" y1="186" x2="632" y2="186" stroke="#f9e2af" stroke-width="2"/>
  <text x="600" y="164" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">o&lt;</text>

  <!-- COURSE → ENROLLMENT -->
  <line x1="770" y1="136" x2="756" y2="188" stroke="#6c7086" stroke-width="2"/>
  <text x="764" y="164" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#f9e2af">o&lt;</text>

  <!-- Relation labels -->
  <text x="614" y="165" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle" font-style="italic">inscrito en</text>
  <text x="768" y="165" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle" font-style="italic">tiene</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Key differences panel at the bottom            -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="0" y="344" width="900" height="100" fill="#181825"/>
  <line x1="0" y1="344" x2="900" y2="344" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="366" font-family="Inter,Roboto,system-ui,sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4" text-anchor="middle">&#191;Cu&#225;ndo promover N:M a entidad asociativa?</text>

  <!-- Three columns -->
  <!-- Column 1 -->
  <rect x="30" y="380" width="260" height="52" rx="6" fill="#1a2d1a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="160" y="400" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">La relaci&#243;n tiene atributos</text>
  <text x="160" y="418" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">enrollment_date, final_grade, status</text>

  <!-- Column 2 -->
  <rect x="320" y="380" width="260" height="52" rx="6" fill="#1a2d1a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="450" y="400" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">Otras entidades la referencian</text>
  <text x="450" y="418" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">payments.enrollment_id → ENROLLMENT</text>

  <!-- Column 3 -->
  <rect x="610" y="380" width="260" height="52" rx="6" fill="#1a2d1a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="740" y="400" font-family="Inter,Roboto,system-ui,sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">Tiene ciclo de vida propio</text>
  <text x="740" y="418" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#9399b2" text-anchor="middle">enrolled &#8594; withdrawn &#8594; passed</text>

  <!-- Footer -->
  <rect x="0" y="446" width="900" height="30" fill="#181825"/>
  <line x1="0" y1="446" x2="900" y2="446" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="466" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="middle">Entidad asociativa: PK sustituta id + UNIQUE (student_id, course_id) &#160;&#183;&#160; Puede ser referenciada por otras tablas &#160;&#183;&#160; Tiene nombre de negocio</text>

  <!-- Footer 2 (legend) -->
  <rect x="0" y="476" width="900" height="30" fill="#181825"/>
  <text x="450" y="496" font-family="Inter,Roboto,system-ui,sans-serif" font-size="11" fill="#585b70" text-anchor="middle">&#128273; PK &#160;&#183;&#160; &#128279; FK &#160;&#183;&#160; doble borde = entidad asociativa &#160;&#183;&#160; o&lt; = cero o muchos &#160;&#183;&#160; || = exactamente uno</text>
</svg>
