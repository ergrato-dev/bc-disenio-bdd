<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <!-- Background -->
  <rect width="880" height="420" fill="#1e1e2e"/>

  <!-- Main title -->
  <text x="440" y="22" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">Herencia en ER: Especialización y Generalización</text>

  <!-- Vertical divider -->
  <line x1="440" y1="34" x2="440" y2="400" stroke="#45475a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ════════════════════════════════════════
       LEFT PANEL — ESPECIALIZACIÓN (top-down)
       ════════════════════════════════════════ -->
  <text x="220" y="48" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">ESPECIALIZACIÓN (top-down)</text>

  <!-- PERSONA (supertipo) -->
  <rect x="145" y="57" width="150" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="220" y="82" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">PERSONA</text>

  <!-- Line: PERSONA → IS-A triangle -->
  <line x1="220" y1="97" x2="220" y2="134" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- IS-A triangle (tip pointing up = toward supertipo) -->
  <polygon points="220,134 165,188 275,188" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
  <text x="220" y="171" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#cba6f7">IS-A</text>

  <!-- Lines: triangle base → subtypes -->
  <line x1="184" y1="188" x2="87" y2="220" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="220" y1="188" x2="222" y2="220" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="256" y1="188" x2="360" y2="220" stroke="#a6e3a1" stroke-width="1.5"/>

  <!-- MÉDICO (subtipo) -->
  <rect x="27" y="220" width="120" height="40" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="87" y="245" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" fill="#cdd6f4">MÉDICO</text>

  <!-- PACIENTE (subtipo) -->
  <rect x="162" y="220" width="120" height="40" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="222" y="245" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" fill="#cdd6f4">PACIENTE</text>

  <!-- ADMINISTRATIVO (subtipo) -->
  <rect x="292" y="220" width="136" height="40" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="360" y="245" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#cdd6f4">ADMINISTRATIVO</text>

  <!-- Process direction annotation -->
  <text x="220" y="292" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#6c7086">Proceso: del tipo general</text>
  <text x="220" y="308" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#6c7086">hacia los tipos específicos</text>

  <!-- Inheritance note -->
  <text x="220" y="342" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#a6e3a1">✓ Heredan: nombre, fecha_nac, email</text>
  <text x="220" y="358" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#f9e2af">+ Atributos propios de cada subtipo</text>

  <!-- Direction arrow (decorative) -->
  <text x="220" y="390" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="18" fill="#45475a">↓</text>

  <!-- ═══════════════════════════════════════
       RIGHT PANEL — GENERALIZACIÓN (bottom-up)
       ═══════════════════════════════════════ -->
  <text x="660" y="48" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f9e2af">GENERALIZACIÓN (bottom-up)</text>

  <!-- VEHÍCULO (supertipo) -->
  <rect x="585" y="57" width="150" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="660" y="82" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">VEHÍCULO</text>

  <!-- Line: VEHÍCULO → IS-A triangle -->
  <line x1="660" y1="97" x2="660" y2="134" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- IS-A triangle (same structure) -->
  <polygon points="660,134 605,188 715,188" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
  <text x="660" y="171" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#cba6f7">IS-A</text>

  <!-- Lines: triangle base → subtypes -->
  <line x1="621" y1="188" x2="525" y2="220" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="660" y1="188" x2="660" y2="220" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="699" y1="188" x2="802" y2="220" stroke="#f9e2af" stroke-width="1.5"/>

  <!-- AUTOMÓVIL (subtipo) -->
  <rect x="462" y="220" width="126" height="40" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="525" y="245" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">AUTOMÓVIL</text>

  <!-- CAMIÓN (subtipo) -->
  <rect x="596" y="220" width="128" height="40" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="660" y="245" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" fill="#cdd6f4">CAMIÓN</text>

  <!-- MOTOCICLETA (subtipo) -->
  <rect x="734" y="220" width="136" height="40" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="802" y="245" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#cdd6f4">MOTOCICLETA</text>

  <!-- Process direction annotation -->
  <text x="660" y="292" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#6c7086">Proceso: de los tipos específicos</text>
  <text x="660" y="308" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#6c7086">hacia el tipo general abstracto</text>

  <!-- Abstraction note -->
  <text x="660" y="342" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#f9e2af">Atributos comunes: marca, año, placa</text>
  <text x="660" y="358" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#a6e3a1">→ Se abstraen en VEHÍCULO</text>

  <!-- Direction arrow (decorative) -->
  <text x="660" y="390" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="18" fill="#45475a">↑</text>
</svg>
