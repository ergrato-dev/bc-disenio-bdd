<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530">
  <!-- Background -->
  <rect width="900" height="530" fill="#1e1e2e"/>

  <!-- Main title -->
  <text x="450" y="22" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">Las 4 Restricciones de la Jerarquía IS-A</text>

  <!-- Column headers -->
  <text x="225" y="42" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#89b4fa">Exclusiva  "d"  (Disjoint)</text>
  <text x="675" y="42" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">Inclusiva  "o"  (Overlapping)</text>

  <!-- Row label: Total -->
  <text x="6" y="180" text-anchor="start" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#a6e3a1" transform="rotate(-90 6 180)">TOTAL (doble línea)</text>
  <!-- Row label: Parcial -->
  <text x="6" y="420" text-anchor="start" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f9e2af" transform="rotate(-90 6 420)">PARCIAL (línea simple)</text>

  <!-- Vertical divider -->
  <line x1="450" y1="50" x2="450" y2="525" stroke="#45475a" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Horizontal divider -->
  <line x1="18" y1="285" x2="895" y2="285" stroke="#45475a" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ════════════════════
       CELL 1: Total + Exclusiva
       ════════════════════ -->
  <!-- Header bar -->
  <rect x="20" y="52" width="425" height="26" rx="3" fill="#1d3a2a"/>
  <text x="232" y="69" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Total + Exclusiva  (Partición)</text>

  <!-- Supertype: EMPLEADO -->
  <rect x="152" y="88" width="160" height="38" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="232" y="112" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">EMPLEADO</text>

  <!-- Total: double line -->
  <line x1="229" y1="126" x2="229" y2="152" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="235" y1="126" x2="235" y2="152" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- IS-A circle with "d" -->
  <circle cx="232" cy="165" r="18" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
  <text x="232" y="170" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cba6f7">d</text>

  <!-- Lines to subtypes -->
  <line x1="215" y1="182" x2="127" y2="212" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="249" y1="182" x2="337" y2="212" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- GERENTE -->
  <rect x="60" y="212" width="134" height="36" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="127" y="235" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">GERENTE</text>

  <!-- TÉCNICO -->
  <rect x="270" y="212" width="134" height="36" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="337" y="235" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">TÉCNICO</text>

  <!-- Example note -->
  <text x="232" y="270" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#6c7086">Todo empleado es Gerente O Técnico — jamás ambos</text>

  <!-- ════════════════════
       CELL 2: Total + Inclusiva
       ════════════════════ -->
  <!-- Header bar -->
  <rect x="455" y="52" width="425" height="26" rx="3" fill="#3a1d28"/>
  <text x="668" y="69" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">Total + Inclusiva</text>

  <!-- Supertype: PRODUCTO -->
  <rect x="588" y="88" width="160" height="38" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="668" y="112" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">PRODUCTO</text>

  <!-- Total: double line -->
  <line x1="665" y1="126" x2="665" y2="152" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="671" y1="126" x2="671" y2="152" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- IS-A circle with "o" -->
  <circle cx="668" cy="165" r="18" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
  <text x="668" y="170" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cba6f7">o</text>

  <!-- Lines to subtypes -->
  <line x1="651" y1="182" x2="563" y2="212" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="685" y1="182" x2="773" y2="212" stroke="#f38ba8" stroke-width="1.5"/>

  <!-- VENDIBLE -->
  <rect x="496" y="212" width="134" height="36" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="563" y="235" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">VENDIBLE</text>

  <!-- ALMACENABLE -->
  <rect x="706" y="212" width="148" height="36" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="780" y="235" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#cdd6f4">ALMACENABLE</text>

  <!-- Example note -->
  <text x="668" y="270" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#6c7086">Todo producto es Vendible Y/O Almacenable — nunca ninguno</text>

  <!-- ════════════════════
       CELL 3: Parcial + Exclusiva
       ════════════════════ -->
  <!-- Header bar -->
  <rect x="20" y="290" width="425" height="26" rx="3" fill="#2d2a17"/>
  <text x="232" y="307" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f9e2af">Parcial + Exclusiva  (la más común)</text>

  <!-- Supertype: PERSONA -->
  <rect x="152" y="326" width="160" height="38" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="232" y="350" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">PERSONA</text>

  <!-- Parcial: single line -->
  <line x1="232" y1="364" x2="232" y2="390" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- IS-A circle with "d" -->
  <circle cx="232" cy="403" r="18" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
  <text x="232" y="408" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cba6f7">d</text>

  <!-- Lines to subtypes -->
  <line x1="215" y1="420" x2="127" y2="450" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="249" y1="420" x2="337" y2="450" stroke="#f9e2af" stroke-width="1.5"/>

  <!-- EMPLEADO -->
  <rect x="60" y="450" width="134" height="36" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="127" y="473" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">EMPLEADO</text>

  <!-- CLIENTE -->
  <rect x="270" y="450" width="134" height="36" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="337" y="473" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">CLIENTE</text>

  <!-- Example note -->
  <text x="232" y="508" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#6c7086">Puede haber personas sin rol — si lo tienen, es uno solo</text>

  <!-- ════════════════════
       CELL 4: Parcial + Inclusiva
       ════════════════════ -->
  <!-- Header bar -->
  <rect x="455" y="290" width="425" height="26" rx="3" fill="#1a1a2e"/>
  <text x="668" y="307" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#cba6f7">Parcial + Inclusiva</text>

  <!-- Supertype: USUARIO -->
  <rect x="588" y="326" width="160" height="38" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="668" y="350" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">USUARIO</text>

  <!-- Parcial: single line -->
  <line x1="668" y1="364" x2="668" y2="390" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- IS-A circle with "o" -->
  <circle cx="668" cy="403" r="18" fill="#1e1e2e" stroke="#cba6f7" stroke-width="2"/>
  <text x="668" y="408" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cba6f7">o</text>

  <!-- Lines to subtypes -->
  <line x1="651" y1="420" x2="563" y2="450" stroke="#cba6f7" stroke-width="1.5"/>
  <line x1="685" y1="420" x2="773" y2="450" stroke="#cba6f7" stroke-width="1.5"/>

  <!-- COMPRADOR -->
  <rect x="496" y="450" width="134" height="36" rx="4" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="563" y="473" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">COMPRADOR</text>

  <!-- VENDEDOR -->
  <rect x="706" y="450" width="134" height="36" rx="4" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="773" y="473" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" fill="#cdd6f4">VENDEDOR</text>

  <!-- Example note -->
  <text x="668" y="508" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#6c7086">Puede ser ambos, uno, o ninguno (solo usuario)</text>
</svg>
