<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <!-- Background -->
  <rect width="900" height="520" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="22" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">R3, R4, R5: Transformación de Relaciones por Cardinalidad</text>

  <!-- Column headers -->
  <rect x="10" y="30" width="278" height="24" rx="3" fill="#29201a"/>
  <text x="149" y="46" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f9e2af">R3 — Relación 1:1</text>
  <rect x="312" y="30" width="276" height="24" rx="3" fill="#1f1f2e"/>
  <text x="450" y="46" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#cba6f7">R4 — Relación 1:N</text>
  <rect x="612" y="30" width="278" height="24" rx="3" fill="#291e26"/>
  <text x="751" y="46" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f38ba8">R5 — Relación N:M</text>

  <!-- Vertical separators -->
  <line x1="300" y1="30" x2="300" y2="515" stroke="#45475a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="602" y1="30" x2="602" y2="515" stroke="#45475a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══════════ R3: 1:1 ═══════════ -->
  <!-- ER diagram area -->
  <!-- Employee box -->
  <rect x="15" y="62" width="100" height="50" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <rect x="15" y="62" width="100" height="20" rx="4" fill="#1d2e3a"/>
  <text x="65" y="76" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#89b4fa">EMPLOYEE</text>
  <text x="25" y="94" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">parcial (simple)</text>
  <text x="25" y="106" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">emp_id, name</text>

  <!-- Relationship diamond -->
  <line x1="117" y1="87" x2="138" y2="87" stroke="#89b4fa" stroke-width="1.5"/>
  <polygon points="150,80 170,87 150,94" fill="none" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="160" y="78" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="8" fill="#f9e2af">gestiona</text>
  <line x1="172" y1="87" x2="190" y2="87" stroke="#89b4fa" stroke-width="2"/>
  <line x1="172" y1="90" x2="190" y2="90" stroke="#89b4fa" stroke-width="1"/>

  <!-- Department box -->
  <rect x="192" y="62" width="90" height="50" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <rect x="192" y="62" width="90" height="20" rx="4" fill="#1d2e3a"/>
  <text x="237" y="76" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#89b4fa">DEPT</text>
  <text x="200" y="94" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">total (doble)</text>
  <text x="200" y="106" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">dept_id, name</text>

  <!-- R3 Rule box -->
  <rect x="15" y="122" width="276" height="48" rx="4" fill="#252535"/>
  <text x="25" y="138" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f9e2af">Regla: FK en el lado con participación total</text>
  <text x="25" y="154" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">→ FK va en DEPARTMENT (total)</text>
  <text x="25" y="168" font-family="Consolas, Monaco, monospace" font-size="10" fill="#a6e3a1">+ UNIQUE para garantizar 1:1</text>

  <!-- DDL 1:1 -->
  <rect x="15" y="178" width="276" height="130" rx="4" fill="#181825"/>
  <text x="25" y="196" font-family="Consolas, Monaco, monospace" font-size="10" fill="#89b4fa">CREATE TABLE departments (</text>
  <text x="25" y="212" font-family="Consolas, Monaco, monospace" font-size="10" fill="#89b4fa">  dept_id UUID PK,</text>
  <text x="25" y="228" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">  dept_name VARCHAR(80) NOT NULL,</text>
  <text x="25" y="244" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f9e2af">  manager_id UUID NOT NULL UNIQUE</text>
  <text x="25" y="260" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f9e2af">    REFERENCES employees(emp_id)</text>
  <text x="25" y="276" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">);</text>
  <text x="25" y="300" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">-- UNIQUE garantiza que sea 1:1</text>
  <text x="25" y="316" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">-- NOT NULL porque participación total</text>

  <!-- Ambos parciales note -->
  <rect x="15" y="318" width="276" height="46" rx="4" fill="#252535" stroke="#f38ba8" stroke-width="1"/>
  <text x="25" y="334" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f38ba8">⚠️ Ambos parciales → tabla de unión</text>
  <text x="25" y="350" font-family="Consolas, Monaco, monospace" font-size="9" fill="#cdd6f4">CREATE TABLE employee_lockers (</text>
  <text x="25" y="364" font-family="Consolas, Monaco, monospace" font-size="9" fill="#cdd6f4">  emp_id UUID UNIQUE, locker_id UUID UNIQUE);</text>

  <!-- ═══════════ R4: 1:N ═══════════ -->
  <!-- Category -->
  <rect x="310" y="62" width="100" height="50" rx="4" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <rect x="310" y="62" width="100" height="20" rx="4" fill="#1f1f2e"/>
  <text x="360" y="76" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#cba6f7">CATEGORY</text>
  <text x="320" y="94" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">cat_id, name</text>
  <text x="320" y="106" font-family="Consolas, Monaco, monospace" font-size="9" fill="#89b4fa">lado 1</text>

  <!-- 1:N relationship line -->
  <line x1="412" y1="87" x2="430" y2="87" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="444" y="82" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#cba6f7">1:N</text>
  <line x1="458" y1="87" x2="478" y2="87" stroke="#cba6f7" stroke-width="1.5"/>
  <!-- Crow's foot (N side) -->
  <line x1="474" y1="82" x2="480" y2="87" stroke="#cba6f7" stroke-width="1.5"/>
  <line x1="474" y1="92" x2="480" y2="87" stroke="#cba6f7" stroke-width="1.5"/>

  <!-- Product -->
  <rect x="482" y="62" width="100" height="50" rx="4" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <rect x="482" y="62" width="100" height="20" rx="4" fill="#1f1f2e"/>
  <text x="532" y="76" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#cba6f7">PRODUCT</text>
  <text x="492" y="94" font-family="Consolas, Monaco, monospace" font-size="9" fill="#cdd6f4">prod_id, name</text>
  <text x="492" y="106" font-family="Consolas, Monaco, monospace" font-size="9" fill="#f38ba8">lado N ← FK aquí</text>

  <!-- R4 Rule box -->
  <rect x="310" y="122" width="280" height="48" rx="4" fill="#252535"/>
  <text x="320" y="138" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#cba6f7">Regla: FK siempre en el lado N</text>
  <text x="320" y="154" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">→ products.category_id REFERENCES categories</text>
  <text x="320" y="168" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">Nunca poner la FK en el lado 1</text>

  <!-- DDL 1:N -->
  <rect x="310" y="178" width="280" height="130" rx="4" fill="#181825"/>
  <text x="320" y="196" font-family="Consolas, Monaco, monospace" font-size="10" fill="#89b4fa">CREATE TABLE products (</text>
  <text x="320" y="212" font-family="Consolas, Monaco, monospace" font-size="10" fill="#89b4fa">  product_id   UUID PK,</text>
  <text x="320" y="228" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f38ba8">  category_id  UUID NOT NULL</text>
  <text x="320" y="244" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f38ba8">    REFERENCES categories(cat_id)</text>
  <text x="320" y="260" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f38ba8">    ON DELETE RESTRICT,</text>
  <text x="320" y="276" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">  product_name VARCHAR(150) NOT NULL</text>
  <text x="320" y="292" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">);</text>

  <!-- Parcial note -->
  <rect x="310" y="316" width="280" height="48" rx="4" fill="#252535"/>
  <text x="320" y="332" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#6c7086">Participación parcial en el lado N:</text>
  <text x="320" y="348" font-family="Consolas, Monaco, monospace" font-size="9" fill="#cdd6f4">dept_id UUID NULL  -- puede no tener depto</text>
  <text x="320" y="362" font-family="Consolas, Monaco, monospace" font-size="9" fill="#cdd6f4">  ON DELETE SET NULL</text>

  <!-- ═══════════ R5: N:M ═══════════ -->
  <!-- Student -->
  <rect x="610" y="62" width="90" height="50" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <rect x="610" y="62" width="90" height="20" rx="4" fill="#291e26"/>
  <text x="655" y="76" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f38ba8">STUDENT</text>
  <text x="620" y="94" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">stu_id, name</text>
  <text x="620" y="106" font-family="Consolas, Monaco, monospace" font-size="9" fill="#f38ba8">lado N</text>

  <!-- N:M label -->
  <text x="754" y="78" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#f38ba8">N:M</text>
  <line x1="702" y1="87" x2="808" y2="87" stroke="#f38ba8" stroke-width="1.5"/>

  <!-- Course -->
  <rect x="810" y="62" width="80" height="50" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <rect x="810" y="62" width="80" height="20" rx="4" fill="#291e26"/>
  <text x="850" y="76" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f38ba8">COURSE</text>
  <text x="820" y="94" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">crs_id, name</text>
  <text x="820" y="106" font-family="Consolas, Monaco, monospace" font-size="9" fill="#f38ba8">lado M</text>

  <!-- R5 Rule box -->
  <rect x="610" y="122" width="280" height="48" rx="4" fill="#252535"/>
  <text x="620" y="138" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f38ba8">Regla: crear tabla de intersección</text>
  <text x="620" y="154" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">enrollments(student_id FK, course_id FK)</text>
  <text x="620" y="168" font-family="Consolas, Monaco, monospace" font-size="9" fill="#6c7086">Atributos de la relación van aquí también</text>

  <!-- DDL N:M -->
  <rect x="610" y="178" width="280" height="150" rx="4" fill="#181825"/>
  <text x="620" y="196" font-family="Consolas, Monaco, monospace" font-size="10" fill="#89b4fa">CREATE TABLE enrollments (</text>
  <text x="620" y="212" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f38ba8">  student_id UUID NOT NULL</text>
  <text x="620" y="228" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f38ba8">    REFERENCES students(stu_id),</text>
  <text x="620" y="244" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f38ba8">  course_id  UUID NOT NULL</text>
  <text x="620" y="260" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f38ba8">    REFERENCES courses(crs_id),</text>
  <text x="620" y="276" font-family="Consolas, Monaco, monospace" font-size="10" fill="#f9e2af">  enroll_date DATE NOT NULL, -- atrib. relación</text>
  <text x="620" y="292" font-family="Consolas, Monaco, monospace" font-size="10" fill="#89b4fa">  PRIMARY KEY (student_id, course_id)</text>
  <text x="620" y="308" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">);</text>

  <!-- UUID note for N:M -->
  <rect x="610" y="336" width="280" height="50" rx="4" fill="#252535" stroke="#a6e3a1" stroke-width="1"/>
  <text x="620" y="352" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#a6e3a1">¿PK compuesta o UUID?</text>
  <text x="620" y="368" font-family="Inter, Roboto, system-ui, sans-serif" font-size="9" fill="#cdd6f4">PK compuesta si la tabla es intersección pura</text>
  <text x="620" y="382" font-family="Inter, Roboto, system-ui, sans-serif" font-size="9" fill="#cdd6f4">UUID + UNIQUE si otras tablas la referencian</text>

  <!-- Bottom shared rule reminder -->
  <rect x="10" y="398" width="880" height="50" rx="4" fill="#252535"/>
  <text x="450" y="414" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f9e2af">Regla universal: toda FK debe declarar ON DELETE explícitamente</text>
  <text x="100" y="434" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">ON DELETE RESTRICT</text>
  <text x="100" y="446" font-family="Inter, Roboto, system-ui, sans-serif" font-size="9" fill="#6c7086">No borrar padre con hijos</text>
  <text x="310" y="434" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">ON DELETE CASCADE</text>
  <text x="310" y="446" font-family="Inter, Roboto, system-ui, sans-serif" font-size="9" fill="#6c7086">Borra hijos con el padre</text>
  <text x="520" y="434" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">ON DELETE SET NULL</text>
  <text x="520" y="446" font-family="Inter, Roboto, system-ui, sans-serif" font-size="9" fill="#6c7086">FK queda NULL</text>
  <text x="720" y="434" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">ON DELETE SET DEFAULT</text>
  <text x="720" y="446" font-family="Inter, Roboto, system-ui, sans-serif" font-size="9" fill="#6c7086">FK queda en valor por defecto</text>

  <!-- Reflexiva note -->
  <rect x="10" y="456" width="880" height="56" rx="4" fill="#181825"/>
  <text x="20" y="472" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#89dceb">Casos especiales:</text>
  <text x="20" y="488" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">Relación reflexiva 1:N → FK auto-referencial: emp.manager_id REFERENCES employees(emp_id)</text>
  <text x="20" y="504" font-family="Consolas, Monaco, monospace" font-size="10" fill="#cdd6f4">Relación ternaria    → tabla con 3 FKs (extensión de R5): prescriptions(doctor_id, patient_id, medicine_id)</text>
</svg>
