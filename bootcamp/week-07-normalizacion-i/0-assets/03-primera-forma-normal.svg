  <line x1="665" y1="140" x2="530" y2="140" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="530" y1="140" x2="530" y2="134" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,2"/>

