  <text x="545" y="282" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">tg-001</text>
  <text x="665" y="282" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#f38ba8">p-001</text>
  <text x="795" y="282" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">SQL</text>
  <rect x="470" y="288" width="420" height="18" fill="#252535"/>
  <text x="545" y="300" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">tg-002</text>
  <text x="665" y="300" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#f38ba8">p-001</text>
  <text x="795" y="300" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">PostgreSQL</text>
  <rect x="470" y="306" width="420" height="18" fill="#181825"/>
  <text x="545" y="318" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">tg-003</text>
  <text x="665" y="318" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#f38ba8">p-002</text>
  <text x="795" y="318" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">Python</text>

  <!-- Checklist -->
  <rect x="470" y="336" width="420" height="110" rx="4" fill="#1e2d1e"/>
  <text x="480" y="352" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#a6e3a1">Checklist 1FN</text>
  <text x="480" y="370" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#cdd6f4">✅ Cada celda tiene un solo valor atómico</text>
  <text x="480" y="386" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#cdd6f4">✅ Sin columnas numeradas (tag_1, tag_2…)</text>
  <text x="480" y="402" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#cdd6f4">✅ Valores multivaluados → tabla separada + FK</text>
  <text x="480" y="418" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#cdd6f4">✅ ON DELETE CASCADE en la tabla derivada</text>
  <text x="480" y="434" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#cdd6f4">✅ Todos los valores de la columna mismo tipo</text>

  <!-- Bottom bar -->
  <rect x="10" y="456" width="880" height="30" rx="4" fill="#181825"/>
  <text x="450" y="476" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#cdd6f4">Llevar a 1FN equivale a aplicar la Regla R6 del ER → Relacional (Semana 06): atributo multivaluado → tabla propia</text>
</svg>
