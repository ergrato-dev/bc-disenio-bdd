  <text x="476" y="158" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="bold" fill="#a6e3a1">customer_phones  <tspan font-size="9" fill="#6c7086">(nueva tabla)</tspan>
  </text>
  <rect x="470" y="164" width="420" height="20" rx="0" fill="#313244"/>
  <text x="545" y="178" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="8.5" fill="#89b4fa">phone_id (PK)</text>
  <text x="665" y="178" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="8.5" fill="#f38ba8">customer_id (FK)</text>
  <text x="795" y="178" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="8.5" fill="#cdd6f4">phone_number</text>
  <text x="875" y="178" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="8.5" fill="#cdd6f4">type</text>
  <rect x="470" y="184" width="420" height="18" fill="#181825"/>
  <text x="545" y="196" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">ph-001</text>
  <text x="665" y="196" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#f38ba8">c-001</text>
  <text x="795" y="196" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">555-1234</text>
  <text x="875" y="196" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">mobile</text>
  <rect x="470" y="202" width="420" height="18" fill="#252535"/>
  <text x="545" y="214" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#cdd6f4">ph-002</text>
  <text x="665" y="214" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="7.5" fill="#f38ba8">c-001</text>
