<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="Inter, Roboto, system-ui, sans-serif">

  <!-- Background -->
  <rect width="920" height="500" fill="#1e1e2e" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="920" height="48" fill="#181825" rx="12"/>
  <rect x="0" y="36" width="920" height="12" fill="#181825"/>
  <text x="460" y="30" fill="#cdd6f4" font-size="15" font-weight="700" text-anchor="middle">Forma Normal de Boyce-Codd (FNBC) — vs Tercera Forma Normal</text>

  <!-- ======== LEFT: Comparison table 3FN vs FNBC ======== -->
  <rect x="16" y="60" width="290" height="280" fill="#313244" rx="8"/>
  <rect x="16" y="60" width="290" height="32" fill="#cba6f7" rx="8"/>
  <rect x="16" y="80" width="290" height="12" fill="#cba6f7"/>
  <text x="161" y="81" fill="#1e1e2e" font-size="13" font-weight="700" text-anchor="middle">Condición: FD no-trivial X → A</text>

  <!-- 3FN row -->
  <rect x="16" y="92" width="290" height="70" fill="#45475a" rx="0"/>
  <text x="28" y="110" fill="#89b4fa" font-size="13" font-weight="700">3FN</text>
  <text x="28" y="128" fill="#cdd6f4" font-size="11">X es superclave</text>
  <text x="148" y="128" fill="#f9e2af" font-size="13">O</text>
  <text x="28" y="146" fill="#cdd6f4" font-size="11">A es un atributo primo</text>
  <text x="200" y="146" fill="#a6e3a1" font-size="11">(parte de alguna CK)</text>

  <!-- FNBC row -->
  <rect x="16" y="162" width="290" height="54" fill="#313244"/>
  <text x="28" y="180" fill="#cba6f7" font-size="13" font-weight="700">FNBC</text>
  <text x="28" y="198" fill="#cdd6f4" font-size="11">X es superclave</text>
  <text x="200" y="198" fill="#f38ba8" font-size="11">SIEMPRE</text>
  <text x="28" y="212" fill="#45475a" font-size="11">(sin excepciones para primos)</text>

  <!-- Key difference box -->
  <rect x="24" y="226" width="275" height="104" fill="#181825" rx="6"/>
  <text x="162" y="244" fill="#f9e2af" font-size="11" font-weight="700" text-anchor="middle">¿Cuándo difieren?</text>
  <text x="34" y="262" fill="#cdd6f4" font-size="10">1. La tabla tiene ≥ 2 claves candidatas</text>
  <text x="34" y="278" fill="#cdd6f4" font-size="10">2. Esas CKs se solapan</text>
  <text x="34" y="294" fill="#cdd6f4" font-size="10">3. Existe FD cuyo determinante NO</text>
  <text x="44" y="309" fill="#cdd6f4" font-size="10">es superclave, pero el dependiente</text>
  <text x="44" y="324" fill="#cdd6f4" font-size="10">SÍ es atributo primo</text>

  <!-- ======== CENTER: class_schedule example ======== -->
  <rect x="326" y="60" width="284" height="280" fill="#313244" rx="8"/>
  <rect x="326" y="60" width="284" height="32" fill="#89b4fa" rx="8"/>
  <rect x="326" y="80" width="284" height="12" fill="#89b4fa"/>
  <text x="468" y="81" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">cursa(estudiante_id, materia_id, profesor_id)</text>

  <!-- CK 1 highlight -->
  <rect x="334" y="100" width="270" height="26" fill="#313244" rx="4" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="344" y="117" fill="#a6e3a1" font-size="11" font-weight="700">CK₁: {estudiante_id, materia_id}</text>
  <text x="556" y="117" fill="#a6e3a1" font-size="9">①</text>

  <!-- CK 2 highlight -->
  <rect x="334" y="132" width="270" height="26" fill="#313244" rx="4" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="344" y="149" fill="#f9e2af" font-size="11" font-weight="700">CK₂: {estudiante_id, profesor_id}</text>
  <text x="556" y="149" fill="#f9e2af" font-size="9">②</text>

  <text x="468" y="173" fill="#cdd6f4" font-size="10" text-anchor="middle">→ Los 3 atributos son PRIMOS (aparecen en alguna CK)</text>

  <!-- FD 1 -->
  <rect x="334" y="182" width="270" height="24" fill="#45475a" rx="4"/>
  <text x="344" y="197" fill="#a6e3a1" font-size="10">{estudiante_id, materia_id} → profesor_id</text>
  <text x="578" y="197" fill="#a6e3a1" font-size="9">✅</text>

  <!-- FD 2 (the violating one) -->
  <rect x="334" y="210" width="270" height="24" fill="#45475a" rx="4" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="344" y="225" fill="#f38ba8" font-size="10" font-weight="700">profesor_id → materia_id</text>
  <text x="544" y="225" fill="#f38ba8" font-size="9">⚠️ viola FNBC</text>

  <text x="344" y="250" fill="#cdd6f4" font-size="10">profesor_id no es superclave</text>
  <text x="344" y="265" fill="#cdd6f4" font-size="10">→ viola FNBC</text>

  <!-- Verdict boxes -->
  <rect x="334" y="276" width="120" height="28" fill="#313244" rx="4" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="394" y="293" fill="#a6e3a1" font-size="12" font-weight="700" text-anchor="middle">3FN ✅</text>

  <rect x="470" y="276" width="130" height="28" fill="#313244" rx="4" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="535" y="293" fill="#f38ba8" font-size="12" font-weight="700" text-anchor="middle">FNBC ❌</text>

  <!-- ======== RIGHT: FNBC decomposition ======== -->
  <rect x="630" y="60" width="274" height="280" fill="#313244" rx="8"/>
  <rect x="630" y="60" width="274" height="32" fill="#a6e3a1" rx="8"/>
  <rect x="630" y="80" width="274" height="12" fill="#a6e3a1"/>
  <text x="767" y="81" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">Descomposición FNBC</text>

  <!-- professor_subject table -->
  <rect x="638" y="100" width="258" height="86" fill="#45475a" rx="6"/>
  <rect x="638" y="100" width="258" height="22" fill="#cba6f7" rx="6"/>
  <rect x="638" y="114" width="258" height="8" fill="#cba6f7"/>
  <text x="767" y="114" fill="#1e1e2e" font-size="11" font-weight="700" text-anchor="middle">professor_subject</text>
  <text x="648" y="135" fill="#a6e3a1" font-size="11" font-weight="700">profesor_id</text>
  <text x="840" y="135" fill="#89b4fa" font-size="10">VARCHAR PK</text>
  <text x="648" y="152" fill="#cdd6f4" font-size="11">materia_id</text>
  <text x="840" y="152" fill="#89b4fa" font-size="10">VARCHAR</text>
  <text x="648" y="180" fill="#a6e3a1" font-size="9">profesor_id → materia_id ✅ (PK)</text>

  <!-- enrollments table -->
  <rect x="638" y="198" width="258" height="86" fill="#45475a" rx="6"/>
  <rect x="638" y="198" width="258" height="22" fill="#89b4fa" rx="6"/>
  <rect x="638" y="212" width="258" height="8" fill="#89b4fa"/>
  <text x="767" y="212" fill="#1e1e2e" font-size="11" font-weight="700" text-anchor="middle">enrollments</text>
  <text x="648" y="233" fill="#a6e3a1" font-size="11" font-weight="700">estudiante_id</text>
  <text x="840" y="233" fill="#89b4fa" font-size="10">VARCHAR</text>
  <text x="648" y="249" fill="#a6e3a1" font-size="11" font-weight="700">profesor_id</text>
  <text x="840" y="249" fill="#f9e2af" font-size="10">FK</text>
  <text x="648" y="278" fill="#a6e3a1" font-size="9">PK: {estudiante_id, profesor_id} ✅</text>

  <!-- Trade-off note -->
  <rect x="638" y="294" width="258" height="38" fill="#181825" rx="6"/>
  <text x="767" y="310" fill="#f9e2af" font-size="10" text-anchor="middle" font-weight="700">⚠️ Trade-off: posible pérdida de FD</text>
  <text x="767" y="326" fill="#cdd6f4" font-size="9" text-anchor="middle">La FD original puede no recuperarse</text>

  <!-- ======== BOTTOM: NF hierarchy ======== -->
  <rect x="16" y="360" width="888" height="120" fill="#181825" rx="8"/>
  <text x="460" y="382" fill="#cba6f7" font-size="13" font-weight="700" text-anchor="middle">Jerarquía de Formas Normales</text>

  <!-- Nested rectangles for hierarchy -->
  <rect x="50" y="394" width="820" height="74" fill="#313244" rx="10" stroke="#45475a" stroke-width="1.5"/>
  <text x="80" y="416" fill="#89b4fa" font-size="11">1FN</text>
  <rect x="120" y="400" width="680" height="62" fill="#45475a" rx="8" stroke="#89b4fa" stroke-width="1"/>
  <text x="150" y="422" fill="#a6e3a1" font-size="11">2FN</text>
  <rect x="190" y="406" width="540" height="50" fill="#313244" rx="6" stroke="#a6e3a1" stroke-width="1"/>
  <text x="220" y="430" fill="#f9e2af" font-size="11">3FN</text>
  <rect x="270" y="412" width="380" height="38" fill="#45475a" rx="6" stroke="#f9e2af" stroke-width="1"/>
  <text x="460" y="436" fill="#cba6f7" font-size="11" font-weight="700" text-anchor="middle">FNBC (más estricta)</text>

  <text x="460" y="484" fill="#45475a" font-size="10" text-anchor="middle">Bootcamp Diseño de Bases de Datos Relacionales — Semana 08</text>
</svg>
