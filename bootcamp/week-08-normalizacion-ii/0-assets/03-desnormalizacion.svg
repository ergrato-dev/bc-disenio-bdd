<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" font-family="Inter, Roboto, system-ui, sans-serif">

  <!-- Background -->
  <rect width="920" height="460" fill="#1e1e2e" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="920" height="48" fill="#181825" rx="12"/>
  <rect x="0" y="36" width="920" height="12" fill="#181825"/>
  <text x="460" y="30" fill="#cdd6f4" font-size="15" font-weight="700" text-anchor="middle">Desnormalización — Árbol de Decisión y Patrones</text>

  <!-- ======== DECISION TREE (left 40%) ======== -->
  <!-- Start node -->
  <rect x="16" y="60" width="356" height="36" fill="#313244" rx="8" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="194" y="83" fill="#cdd6f4" font-size="12" text-anchor="middle">¿La consulta tarda más de 100ms (p95)?</text>

  <!-- NO branch -->
  <line x1="100" y1="96" x2="100" y2="126" stroke="#45475a" stroke-width="1.5"/>
  <rect x="16" y="126" width="166" height="30" fill="#181825" rx="6" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="99" y="145" fill="#a6e3a1" font-size="11" text-anchor="middle" font-weight="700">NO → No desnormalizar</text>
  <text x="60" y="112" fill="#a6e3a1" font-size="10">NO</text>

  <!-- YES branch -->
  <line x1="288" y1="96" x2="288" y2="126" stroke="#45475a" stroke-width="1.5"/>
  <text x="302" y="112" fill="#f38ba8" font-size="10">SÍ</text>
  <rect x="200" y="126" width="172" height="30" fill="#313244" rx="6" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="286" y="145" fill="#cdd6f4" font-size="11" text-anchor="middle">¿Tienes índices correctos?</text>

  <!-- NO-índices branch -->
  <line x1="216" y1="156" x2="216" y2="186" stroke="#45475a" stroke-width="1.5"/>
  <text x="188" y="172" fill="#a6e3a1" font-size="10">NO</text>
  <rect x="140" y="186" width="152" height="30" fill="#181825" rx="6" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="216" y="205" fill="#f9e2af" font-size="11" text-anchor="middle">Agregar índices primero</text>

  <!-- YES-índices branch → tabla tipo→patrón (encaja en panel izquierdo) -->
  <line x1="356" y1="156" x2="356" y2="228" stroke="#45475a" stroke-width="1.5"/>
  <text x="364" y="172" fill="#f38ba8" font-size="10">SÍ</text>

  <!-- Tabla compacta: Tipo de problema → Patrón recomendado (x=20..380) -->
  <rect x="20" y="228" width="360" height="92" fill="#181825" rx="6" stroke="#89b4fa" stroke-width="1.5"/>
  <!-- Encabezado -->
  <rect x="20" y="228" width="360" height="24" fill="#313244" rx="6"/>
  <rect x="20" y="244" width="360" height="8" fill="#313244"/>
  <text x="32" y="244" fill="#89b4fa" font-size="11" font-weight="700">Tipo de problema</text>
  <text x="372" y="244" fill="#89b4fa" font-size="11" font-weight="700" text-anchor="end">Patrón</text>
  <!-- Fila 1 -->
  <line x1="20" y1="252" x2="380" y2="252" stroke="#45475a" stroke-width="1"/>
  <text x="32" y="266" fill="#cba6f7" font-size="10">JOIN costoso (columna leída miles de veces/s)</text>
  <text x="372" y="266" fill="#cba6f7" font-size="10" text-anchor="end">1 ó 3</text>
  <!-- Fila 2 -->
  <line x1="20" y1="272" x2="380" y2="272" stroke="#45475a" stroke-width="1"/>
  <text x="32" y="286" fill="#f9e2af" font-size="10">SUM/COUNT frecuente (totales pre-calculados)</text>
  <text x="372" y="286" fill="#f9e2af" font-size="10" text-anchor="end">2 ó 3</text>
  <!-- Fila 3 -->
  <line x1="20" y1="292" x2="380" y2="292" stroke="#45475a" stroke-width="1"/>
  <text x="32" y="306" fill="#89b4fa" font-size="10">Atributos NULL masivos o heterogéneos</text>
  <text x="372" y="306" fill="#89b4fa" font-size="10" text-anchor="end">4</text>

  <!-- Always document note -->
  <rect x="20" y="336" width="352" height="36" fill="#181825" rx="6" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="196" y="353" fill="#f38ba8" font-size="11" font-weight="700" text-anchor="middle">⚠️ En TODOS los casos: DOCUMENTAR la decisión</text>
  <text x="196" y="366" fill="#cdd6f4" font-size="10" text-anchor="middle">razón · trade-off aceptado · responsable de sincronización</text>

  <!-- Vertical separator -->
  <line x1="396" y1="56" x2="396" y2="440" stroke="#45475a" stroke-width="1.5"/>

  <!-- ======== RIGHT: Patterns panel ======== -->
  <!-- Pattern 1 -->
  <rect x="408" y="60" width="498" height="86" fill="#313244" rx="8"/>
  <rect x="408" y="60" width="498" height="26" fill="#cba6f7" rx="8"/>
  <rect x="408" y="78" width="498" height="8" fill="#cba6f7"/>
  <text x="657" y="77" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">Patrón 1 — Columna Redundante</text>
  <text x="420" y="100" fill="#cdd6f4" font-size="11">Copiar un atributo de la tabla relacionada para evitar el JOIN.</text>
  <text x="420" y="116" fill="#f9e2af" font-size="10">Ejemplo: city_name redundante en customers</text>
  <text x="710" y="116" fill="#f38ba8" font-size="10">Costo: trigger de sincronización</text>
  <text x="420" y="136" fill="#a6e3a1" font-size="10">Uso: columna que cambia raramente y se lee miles de veces/segundo</text>

  <!-- Pattern 2 -->
  <rect x="408" y="158" width="498" height="86" fill="#313244" rx="8"/>
  <rect x="408" y="158" width="498" height="26" fill="#f9e2af" rx="8"/>
  <rect x="408" y="176" width="498" height="8" fill="#f9e2af"/>
  <text x="657" y="175" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">Patrón 2 — Columna Calculada (Agregado)</text>
  <text x="420" y="198" fill="#cdd6f4" font-size="11">Almacenar SUM/COUNT pre-calculado directamente en la tabla padre.</text>
  <text x="420" y="214" fill="#f9e2af" font-size="10">Ejemplo: invoice_total en invoices (en lugar de SUM de invoice_lines)</text>
  <text x="710" y="214" fill="#f38ba8" font-size="10">Costo: trigger AFTER DML</text>
  <text x="420" y="234" fill="#a6e3a1" font-size="10">Uso: dashboards, listados paginados con totales visibles</text>

  <!-- Pattern 3 -->
  <rect x="408" y="256" width="498" height="86" fill="#313244" rx="8"/>
  <rect x="408" y="256" width="498" height="26" fill="#89b4fa" rx="8"/>
  <rect x="408" y="274" width="498" height="8" fill="#89b4fa"/>
  <text x="657" y="273" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">Patrón 3 — Vista Materializada / Tabla Resumen</text>
  <text x="420" y="296" fill="#cdd6f4" font-size="11">Tabla o vista materializada con datos pre-agregados para analítica.</text>
  <text x="420" y="312" fill="#f9e2af" font-size="10">Ejemplo: mv_sales_by_region para reportes ejecutivos mensuales</text>
  <text x="710" y="312" fill="#f38ba8" font-size="10">Costo: refresco periódico</text>
  <text x="420" y="332" fill="#a6e3a1" font-size="10">Uso: OLAP, reporting BI, consultas de más de 3 tablas con GROUP BY</text>

  <!-- Pattern 4 -->
  <rect x="408" y="354" width="498" height="76" fill="#313244" rx="8"/>
  <rect x="408" y="354" width="498" height="26" fill="#a6e3a1" rx="8"/>
  <rect x="408" y="372" width="498" height="8" fill="#a6e3a1"/>
  <text x="657" y="371" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">Patrón 4 — JSONB para Atributos Variables</text>
  <text x="420" y="394" fill="#cdd6f4" font-size="11">Columna JSONB agrupa atributos opcionales/heterogéneos.</text>
  <text x="420" y="410" fill="#f9e2af" font-size="10">Ejemplo: product_metadata para atributos distintos por tipo de producto</text>
  <text x="420" y="422" fill="#a6e3a1" font-size="10">Uso: catálogos con tipos heterogéneos, atributos opcionales &gt; 10</text>

  <!-- Footer -->
  <text x="460" y="450" fill="#45475a" font-size="10" text-anchor="middle">Bootcamp Diseño de Bases de Datos Relacionales — Semana 08</text>
</svg>
