<svg viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="440" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="36" fill="#cdd6f4" font-size="18" font-weight="700" text-anchor="middle">CHECK y NOT NULL — Restricciones de Dominio</text>

  <!-- ─── LEFT PANEL: NOT NULL ─── -->
  <rect x="20" y="56" width="430" height="366" rx="8" fill="#313244"/>
  <rect x="20" y="56" width="430" height="30" rx="8" fill="#a6e3a1"/>
  <text x="235" y="76" fill="#1e1e2e" font-size="13" font-weight="700" text-anchor="middle">NOT NULL</text>

  <!-- default nullable -->
  <rect x="34" y="100" width="402" height="60" rx="6" fill="#181825"/>
  <text x="235" y="118" fill="#f9e2af" font-size="10" font-weight="700" text-anchor="middle">Por defecto, todas las columnas aceptan NULL</text>
  <text x="235" y="133" fill="#cdd6f4" font-size="9" text-anchor="middle">-- ❌ Esto es nullable (acepta NULL por defecto):</text>
  <text x="235" y="148" fill="#cdd6f4" font-size="9" text-anchor="middle">product_name  VARCHAR(120)           →  acepta NULL</text>

  <!-- explicit NOT NULL -->
  <rect x="34" y="172" width="402" height="60" rx="6" fill="#181825"/>
  <text x="235" y="190" fill="#a6e3a1" font-size="10" font-weight="700" text-anchor="middle">Declarar explícitamente lo que es obligatorio</text>
  <text x="235" y="205" fill="#a6e3a1" font-size="9" text-anchor="middle">product_name  VARCHAR(120)  NOT NULL  →  siempre requerido</text>
  <text x="235" y="220" fill="#cdd6f4" font-size="9" text-anchor="middle">product_desc  TEXT                   →  opcional (NULL válido)</text>

  <!-- NULL semantics -->
  <rect x="34" y="244" width="402" height="100" rx="6" fill="#181825"/>
  <text x="235" y="262" fill="#f38ba8" font-size="10" font-weight="700" text-anchor="middle">NULL semántico — tres significados distintos</text>

  <rect x="46" y="270" width="116" height="64" rx="4" fill="#313244"/>
  <text x="104" y="286" fill="#cba6f7" font-size="9" font-weight="700" text-anchor="middle">Ausencia</text>
  <text x="104" y="300" fill="#cdd6f4" font-size="9" text-anchor="middle">El dato no existe</text>
  <text x="104" y="314" fill="#89b4fa" font-size="8" text-anchor="middle">product_description</text>
  <text x="104" y="326" fill="#89b4fa" font-size="8" text-anchor="middle">puede ser NULL</text>

  <rect x="172" y="270" width="120" height="64" rx="4" fill="#313244"/>
  <text x="232" y="286" fill="#cba6f7" font-size="9" font-weight="700" text-anchor="middle">No aplica</text>
  <text x="232" y="300" fill="#cdd6f4" font-size="9" text-anchor="middle">Semántica válida</text>
  <text x="232" y="314" fill="#89b4fa" font-size="8" text-anchor="middle">deleted_at NULL =</text>
  <text x="232" y="326" fill="#89b4fa" font-size="8" text-anchor="middle">"aún activo"</text>

  <rect x="302" y="270" width="122" height="64" rx="4" fill="#313244"/>
  <text x="363" y="286" fill="#cba6f7" font-size="9" font-weight="700" text-anchor="middle">Desconocido</text>
  <text x="363" y="300" fill="#cdd6f4" font-size="9" text-anchor="middle">Dato no disponible</text>
  <text x="363" y="314" fill="#89b4fa" font-size="8" text-anchor="middle">parent_id NULL =</text>
  <text x="363" y="326" fill="#89b4fa" font-size="8" text-anchor="middle">nodo raíz</text>

  <!-- warning -->
  <rect x="34" y="356" width="402" height="54" rx="6" fill="#181825"/>
  <text x="235" y="373" fill="#f9e2af" font-size="9" font-weight="700" text-anchor="middle">⚠  NULL no es lo mismo que '' (cadena vacía) ni 0</text>
  <text x="235" y="387" fill="#cdd6f4" font-size="9" text-anchor="middle">NULL + cualquier operación = NULL (contagio)</text>
  <text x="235" y="400" fill="#cdd6f4" font-size="9" text-anchor="middle">Siempre usar IS NULL / IS NOT NULL para comparar</text>

  <!-- ─── RIGHT PANEL: CHECK ─── -->
  <rect x="466" y="56" width="434" height="366" rx="8" fill="#313244"/>
  <rect x="466" y="56" width="434" height="30" rx="8" fill="#f9e2af"/>
  <text x="683" y="76" fill="#1e1e2e" font-size="13" font-weight="700" text-anchor="middle">CHECK</text>

  <!-- column level check -->
  <rect x="480" y="100" width="406" height="70" rx="6" fill="#181825"/>
  <text x="683" y="118" fill="#a6e3a1" font-size="10" font-weight="700" text-anchor="middle">CHECK a nivel de columna</text>
  <text x="496" y="136" fill="#cdd6f4" font-size="9">CONSTRAINT ck_products_price   CHECK (product_price &gt; 0)</text>
  <text x="496" y="151" fill="#cdd6f4" font-size="9">CONSTRAINT ck_products_stock   CHECK (product_stock &gt;= 0)</text>
  <text x="496" y="163" fill="#cdd6f4" font-size="9">CONSTRAINT ck_products_rating  CHECK (product_rating BETWEEN 0 AND 5)</text>

  <!-- table level check -->
  <rect x="480" y="182" width="406" height="64" rx="6" fill="#181825"/>
  <text x="683" y="200" fill="#cba6f7" font-size="10" font-weight="700" text-anchor="middle">CHECK a nivel de tabla (multi-columna)</text>
  <text x="496" y="218" fill="#cdd6f4" font-size="9">CONSTRAINT ck_promos_dates</text>
  <text x="496" y="232" fill="#cdd6f4" font-size="9">    CHECK (ends_at &gt; starts_at)</text>
  <text x="496" y="238" fill="#89b4fa" font-size="8">-- compara dos columnas de la misma fila</text>

  <!-- enum via check -->
  <rect x="480" y="258" width="406" height="60" rx="6" fill="#181825"/>
  <text x="683" y="276" fill="#f9e2af" font-size="10" font-weight="700" text-anchor="middle">Validar conjuntos (mejor que ENUM)</text>
  <text x="496" y="294" fill="#cdd6f4" font-size="9">CONSTRAINT ck_orders_status  CHECK (</text>
  <text x="496" y="308" fill="#cdd6f4" font-size="9">    order_status IN ('pending','confirmed','shipped','cancelled')</text>
  <text x="496" y="316" fill="#cdd6f4" font-size="9">)</text>

  <!-- regex check -->
  <rect x="480" y="330" width="406" height="60" rx="6" fill="#181825"/>
  <text x="683" y="348" fill="#89b4fa" font-size="10" font-weight="700" text-anchor="middle">CHECK con expresión regular</text>
  <text x="496" y="366" fill="#cdd6f4" font-size="9">CONSTRAINT ck_contacts_email  CHECK (</text>
  <text x="496" y="380" fill="#cdd6f4" font-size="9">    contact_email ~* '^[^@]+@[^@]+\.[^@]+$'</text>
  <text x="496" y="394" fill="#cdd6f4" font-size="9">)</text>

  <!-- naming note at bottom left -->
  <text x="235" y="422" fill="#cba6f7" font-size="9" text-anchor="middle">Convención: ck_tabla_descripcion</text>

  <!-- limitation note at bottom right -->
  <text x="683" y="422" fill="#f38ba8" font-size="9" text-anchor="middle">⚠  CHECK no puede hacer subconsultas — no reemplaza FK</text>
</svg>
