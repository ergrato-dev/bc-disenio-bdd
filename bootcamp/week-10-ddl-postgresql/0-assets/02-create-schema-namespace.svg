<svg viewBox="0 0 920 440"
  xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="440" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="36" fill="#cdd6f4" font-size="17" font-weight="700" text-anchor="middle">CREATE SCHEMA — Namespacing y search_path</text>

  <!-- ─── DATABASE BOX ─── -->
  <rect x="20" y="55" width="880" height="225" rx="10" fill="#181825" stroke="#45475a" stroke-width="2"/>
  <rect x="20" y="55" width="880" height="26" rx="10" fill="#313244" stroke="#45475a" stroke-width="2"/>
  <text x="460" y="73" fill="#89b4fa" font-size="12" font-weight="700" text-anchor="middle">DATABASE: bootcamp_db</text>

  <!-- Schema: public -->
  <rect x="38" y="92" width="195" height="178" rx="8" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <rect x="38" y="92" width="195" height="22" rx="8" fill="#45475a"/>
  <text x="135" y="108" fill="#cdd6f4" font-size="10" font-weight="700" text-anchor="middle">schema: public</text>
  <!-- objects in public -->
  <rect x="48" y="120" width="175" height="18" rx="3" fill="#181825"/>
  <text x="135" y="133" fill="#cdd6f4" font-size="9" text-anchor="middle">users</text>
  <rect x="48" y="140" width="175" height="18" rx="3" fill="#181825"/>
  <text x="135" y="153" fill="#cdd6f4" font-size="9" text-anchor="middle">legacy_data</text>
  <text x="135" y="200" fill="#45475a" font-size="8" text-anchor="middle">schema por defecto</text>
  <text x="135" y="214" fill="#45475a" font-size="8" text-anchor="middle">siempre en search_path</text>

  <!-- Schema: app -->
  <rect x="249" y="92" width="195" height="178" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <rect x="249" y="92" width="195" height="22" rx="8" fill="#89b4fa"/>
  <text x="346" y="108" fill="#1e1e2e" font-size="10" font-weight="700" text-anchor="middle">schema: app</text>
  <rect x="259" y="120" width="175" height="18" rx="3" fill="#181825"/>
  <text x="346" y="133" fill="#a6e3a1" font-size="9" text-anchor="middle">app.users</text>
  <rect x="259" y="140" width="175" height="18" rx="3" fill="#181825"/>
  <text x="346" y="153" fill="#a6e3a1" font-size="9" text-anchor="middle">app.orders</text>
  <rect x="259" y="160" width="175" height="18" rx="3" fill="#181825"/>
  <text x="346" y="173" fill="#a6e3a1" font-size="9" text-anchor="middle">app.products</text>
  <text x="346" y="200" fill="#89b4fa" font-size="8" text-anchor="middle">tablas principales</text>
  <text x="346" y="214" fill="#89b4fa" font-size="8" text-anchor="middle">de la aplicación</text>
  <rect x="259" y="220" width="175" height="36" rx="4" fill="#181825"/>
  <text x="346" y="234" fill="#cba6f7" font-size="8" text-anchor="middle">pk_users → válido aquí</text>
  <text x="346" y="246" fill="#cdd6f4" font-size="7" text-anchor="middle">constraints con scope de schema</text>

  <!-- Schema: audit -->
  <rect x="460" y="92" width="195" height="178" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <rect x="460" y="92" width="195" height="22" rx="8" fill="#f9e2af"/>
  <text x="557" y="108" fill="#1e1e2e" font-size="10" font-weight="700" text-anchor="middle">schema: audit</text>
  <rect x="470" y="120" width="175" height="18" rx="3" fill="#181825"/>
  <text x="557" y="133" fill="#f9e2af" font-size="9" text-anchor="middle">audit.change_log</text>
  <rect x="470" y="140" width="175" height="18" rx="3" fill="#181825"/>
  <text x="557" y="153" fill="#f9e2af" font-size="9" text-anchor="middle">audit.login_events</text>
  <text x="557" y="200" fill="#f9e2af" font-size="8" text-anchor="middle">historial de cambios</text>
  <text x="557" y="214" fill="#f9e2af" font-size="8" text-anchor="middle">acceso restringido</text>
  <rect x="470" y="220" width="175" height="36" rx="4" fill="#181825"/>
  <text x="557" y="234" fill="#cba6f7" font-size="8" text-anchor="middle">pk_users → válido aquí también</text>
  <text x="557" y="246" fill="#cdd6f4" font-size="7" text-anchor="middle">mismo nombre, distinto scope</text>

  <!-- Schema: api -->
  <rect x="671" y="92" width="210" height="178" rx="8" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <rect x="671" y="92" width="210" height="22" rx="8" fill="#cba6f7"/>
  <text x="776" y="108" fill="#1e1e2e" font-size="10" font-weight="700" text-anchor="middle">schema: api</text>
  <rect x="681" y="120" width="190" height="18" rx="3" fill="#181825"/>
  <text x="776" y="133" fill="#cba6f7" font-size="9" text-anchor="middle">api.vw_active_products</text>
  <rect x="681" y="140" width="190" height="18" rx="3" fill="#181825"/>
  <text x="776" y="153" fill="#cba6f7" font-size="9" text-anchor="middle">api.fn_get_order_total()</text>
  <text x="776" y="200" fill="#cba6f7" font-size="8" text-anchor="middle">vistas y funciones</text>
  <text x="776" y="214" fill="#cba6f7" font-size="8" text-anchor="middle">expuestas al exterior</text>

  <!-- ─── SEARCH_PATH SECTION ─── -->
  <rect x="20" y="292" width="545" height="135" rx="8" fill="#313244"/>
  <rect x="20" y="292" width="545" height="24" rx="8" fill="#89b4fa"/>
  <text x="292" y="309" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">search_path — Resolución de Nombres</text>

  <!-- query box -->
  <rect x="32" y="322" width="245" height="94" rx="5" fill="#181825"/>
  <text x="154" y="339" fill="#f9e2af" font-size="9" font-weight="700" text-anchor="middle">Consulta sin calificar:</text>
  <text x="40" y="356" fill="#cba6f7" font-size="9">SET search_path = app, public;</text>
  <text x="40" y="372" fill="#cba6f7" font-size="9">SELECT * FROM users;</text>
  <text x="40" y="393" fill="#45475a" font-size="8">-- ¿A qué tabla apunta "users"?</text>
  <text x="40" y="407" fill="#45475a" font-size="8">-- PostgreSQL busca en: app → public</text>

  <!-- arrow -->
  <line x1="277" y1="372" x2="297" y2="372" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow1)"/>
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#89b4fa"/>
    </marker>
  </defs>

  <!-- resolution steps -->
  <rect x="300" y="322" width="255" height="94" rx="5" fill="#181825"/>
  <text x="427" y="339" fill="#a6e3a1" font-size="9" font-weight="700" text-anchor="middle">Resultado:</text>
  <text x="308" y="356" fill="#cdd6f4" font-size="9">1. Busca en schema app → app.users ✅</text>
  <text x="308" y="370" fill="#45475a" font-size="9">2. (No llega a public.users)</text>
  <text x="308" y="390" fill="#a6e3a1" font-size="9">→ Resuelve a app.users</text>
  <text x="308" y="407" fill="#89b4fa" font-size="8">Calificar siempre en scripts: app.users</text>

  <!-- ─── BEST PRACTICES BOX ─── -->
  <rect x="577" y="292" width="323" height="135" rx="8" fill="#313244"/>
  <rect x="577" y="292" width="323" height="24" rx="8" fill="#a6e3a1"/>
  <text x="738" y="309" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">Comandos Clave</text>

  <rect x="587" y="322" width="303" height="94" rx="5" fill="#181825"/>
  <text x="595" y="339" fill="#a6e3a1" font-size="9">CREATE SCHEMA IF NOT EXISTS app;</text>
  <text x="595" y="354" fill="#a6e3a1" font-size="9">SET search_path = app, public;</text>
  <text x="595" y="369" fill="#cba6f7" font-size="9">ALTER ROLE myapp_role</text>
  <text x="595" y="381" fill="#cba6f7" font-size="9">  SET search_path = app, public;</text>
  <text x="595" y="396" fill="#f9e2af" font-size="9">ALTER DEFAULT PRIVILEGES</text>
  <text x="595" y="408" fill="#f9e2af" font-size="9">  IN SCHEMA app GRANT SELECT ON TABLES TO reader;</text>
</svg>
