<svg viewBox="0 0 920 420"
  xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="420" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="32" fill="#cdd6f4" font-size="17" font-weight="700" text-anchor="middle">Identidades y Secuencias — SERIAL vs IDENTITY vs UUID</text>

  <!-- ─── SERIAL (legacy) ─── -->
  <rect x="20" y="50" width="268" height="270" rx="8" fill="#313244"/>
  <rect x="20" y="50" width="268" height="26" rx="8" fill="#f38ba8"/>
  <text x="154" y="68" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">SERIAL / BIGSERIAL (Legado)</text>

  <rect x="30" y="84" width="248" height="80" rx="5" fill="#181825"/>
  <text x="40" y="100" fill="#45475a" font-size="9">-- shorthand crea 3 objetos separados:</text>
  <text x="40" y="113" fill="#cba6f7" font-size="9">CREATE SEQUENCE users_user_id_seq;</text>
  <text x="40" y="126" fill="#cba6f7" font-size="9">user_id INTEGER</text>
  <text x="40" y="139" fill="#cba6f7" font-size="9">  DEFAULT nextval('users_user_id_seq');</text>
  <text x="40" y="152" fill="#cba6f7" font-size="9">-- sequence owned by users.user_id</text>

  <text x="154" y="178" fill="#f38ba8" font-size="9" text-anchor="middle">Problemas:</text>
  <text x="40" y="194" fill="#cdd6f4" font-size="8">❌ Secuencia separada visible en el schema</text>
  <text x="40" y="208" fill="#cdd6f4" font-size="8">❌ Nombre automático puede colisionar</text>
  <text x="40" y="222" fill="#cdd6f4" font-size="8">❌ No es estándar SQL</text>
  <text x="40" y="236" fill="#cdd6f4" font-size="8">❌ No soporta OVERRIDING SYSTEM VALUE</text>
  <text x="40" y="256" fill="#f9e2af" font-size="8">⚠️  Aún común en código heredado — reconocer,</text>
  <text x="40" y="268" fill="#f9e2af" font-size="8">    pero no usar en diseño nuevo</text>
  <text x="40" y="285" fill="#45475a" font-size="9" font-weight="700">Usar solo si: código legacy obliga</text>
  <text x="40" y="298" fill="#45475a" font-size="9">  o PK secuencial de INTEGER</text>

  <!-- ─── GENERATED ALWAYS AS IDENTITY ─── -->
  <rect x="302" y="50" width="316" height="270" rx="8" fill="#313244"/>
  <rect x="302" y="50" width="316" height="26" rx="8" fill="#a6e3a1"/>
  <text x="460" y="68" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">GENERATED AS IDENTITY (✅ Moderno)</text>

  <rect x="312" y="84" width="296" height="95" rx="5" fill="#181825"/>
  <text x="320" y="100" fill="#45475a" font-size="9">-- GENERATED ALWAYS: motor siempre genera</text>
  <text x="320" y="113" fill="#a6e3a1" font-size="9">task_number BIGINT NOT NULL</text>
  <text x="320" y="126" fill="#a6e3a1" font-size="9">  GENERATED ALWAYS AS IDENTITY</text>
  <text x="320" y="139" fill="#a6e3a1" font-size="9">  (START WITH 1 INCREMENT BY 1),</text>
  <line x1="312" y1="150" x2="608" y2="150" stroke="#45475a" stroke-width="1"/>
  <text x="320" y="164" fill="#45475a" font-size="9">-- BY DEFAULT: permite insertar explícito</text>
  <text x="320" y="176" fill="#cba6f7" font-size="9">invoice_number BIGINT NOT NULL</text>
  <text x="320" y="188" fill="#cba6f7" font-size="9">  GENERATED BY DEFAULT AS IDENTITY;</text>

  <text x="460" y="210" fill="#a6e3a1" font-size="9" font-weight="700" text-anchor="middle">Ventajas:</text>
  <text x="320" y="226" fill="#cdd6f4" font-size="8">✅ Estándar SQL:2003 (portable)</text>
  <text x="320" y="240" fill="#cdd6f4" font-size="8">✅ Secuencia encapsulada en la columna</text>
  <text x="320" y="254" fill="#cdd6f4" font-size="8">✅ OVERRIDING SYSTEM VALUE para migraciones</text>
  <text x="320" y="268" fill="#a6e3a1" font-size="8">✅ RESTART WITH N sin DROP SEQUENCE</text>
  <text x="320" y="288" fill="#a6e3a1" font-size="9" font-weight="700">Usar para: números visibles al usuario</text>
  <text x="320" y="300" fill="#a6e3a1" font-size="9">(N° factura, N° ticket, task_number)</text>

  <!-- ─── UUID as PK ─── -->
  <rect x="632" y="50" width="268" height="270" rx="8" fill="#313244"/>
  <rect x="632" y="50" width="268" height="26" rx="8" fill="#89b4fa"/>
  <text x="766" y="68" fill="#1e1e2e" font-size="12" font-weight="700" text-anchor="middle">UUID (✅ Default para toda PK)</text>

  <rect x="642" y="84" width="248" height="80" rx="5" fill="#181825"/>
  <text x="650" y="100" fill="#89b4fa" font-size="9">user_id UUID NOT NULL</text>
  <text x="650" y="113" fill="#89b4fa" font-size="9">  DEFAULT gen_random_uuid(),</text>
  <text x="650" y="126" fill="#45475a" font-size="9">-- gen_random_uuid() = built-in PG13+</text>
  <text x="650" y="139" fill="#45475a" font-size="9">-- PG12-: uuid_generate_v4() + extensión</text>

  <text x="766" y="178" fill="#89b4fa" font-size="9" text-anchor="middle">Ventajas:</text>
  <text x="650" y="194" fill="#cdd6f4" font-size="8">✅ No predecible (seguridad)</text>
  <text x="650" y="208" fill="#cdd6f4" font-size="8">✅ Distribuido — sin coordinación central</text>
  <text x="650" y="222" fill="#cdd6f4" font-size="8">✅ Se puede generar en la app o la BD</text>
  <text x="650" y="240" fill="#f38ba8" font-size="8">❌ No legible para el usuario final</text>
  <text x="650" y="254" fill="#f38ba8" font-size="8">❌ 16 bytes vs 8 de BIGINT</text>
  <text x="650" y="274" fill="#89b4fa" font-size="9" font-weight="700">Usar para: toda PK de entidad interna</text>
  <text x="650" y="286" fill="#89b4fa" font-size="9">Combinar con IDENTITY si el usuario</text>
  <text x="650" y="298" fill="#89b4fa" font-size="9">necesita ver un número legible</text>

  <!-- ─── COMPARISON TABLE ─── -->
  <rect x="20" y="333" width="880" height="75" rx="8" fill="#313244"/>
  <rect x="20" y="333" width="880" height="22" rx="8" fill="#45475a"/>
  <text x="460" y="349" fill="#cdd6f4" font-size="10" font-weight="700" text-anchor="middle">Comparación de Propiedades</text>

  <!-- headers -->
  <text x="120" y="370" fill="#89b4fa" font-size="9" text-anchor="middle">Propiedad</text>
  <text x="290" y="370" fill="#f38ba8" font-size="9" text-anchor="middle">SERIAL</text>
  <text x="465" y="370" fill="#a6e3a1" font-size="9" text-anchor="middle">GENERATED ALWAYS AS IDENTITY</text>
  <text x="700" y="370" fill="#89b4fa" font-size="9" text-anchor="middle">UUID</text>

  <text x="120" y="388" fill="#cdd6f4" font-size="8" text-anchor="middle">¿Estándar SQL?</text>
  <text x="290" y="388" fill="#f38ba8" font-size="8" text-anchor="middle">No</text>
  <text x="465" y="388" fill="#a6e3a1" font-size="8" text-anchor="middle">Sí (SQL:2003)</text>
  <text x="700" y="388" fill="#cdd6f4" font-size="8" text-anchor="middle">Tipo nativo</text>

  <text x="120" y="400" fill="#cdd6f4" font-size="8" text-anchor="middle">¿Visible al usuario?</text>
  <text x="290" y="400" fill="#cdd6f4" font-size="8" text-anchor="middle">Posible</text>
  <text x="465" y="400" fill="#a6e3a1" font-size="8" text-anchor="middle">✅ Ideal para ello</text>
  <text x="700" y="400" fill="#f38ba8" font-size="8" text-anchor="middle">No recomendado</text>
</svg>
