<svg viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="420" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="32" fill="#cdd6f4" font-size="17" font-weight="700" text-anchor="middle">Tipos de Índices — Cuándo Usar Cada Uno</text>

  <!-- ─── BTREE ─── -->
  <rect x="20" y="50" width="168" height="290" rx="8" fill="#313244"/>
  <rect x="20" y="50" width="168" height="24" rx="8" fill="#89b4fa"/>
  <text x="104" y="67" fill="#1e1e2e" font-size="11" font-weight="700" text-anchor="middle">B-tree</text>
  <rect x="30" y="82" width="148" height="248" rx="5" fill="#181825"/>
  <text x="104" y="99" fill="#89b4fa" font-size="9" font-weight="700" text-anchor="middle">Operadores</text>
  <text x="38" y="114" fill="#a6e3a1" font-size="9">=  &lt;  &lt;=  &gt;  &gt;=</text>
  <text x="38" y="127" fill="#a6e3a1" font-size="9">BETWEEN</text>
  <text x="38" y="140" fill="#a6e3a1" font-size="9">LIKE 'prefijo%'</text>
  <text x="38" y="153" fill="#a6e3a1" font-size="9">IS NULL / IS NOT NULL</text>
  <text x="38" y="166" fill="#a6e3a1" font-size="9">ORDER BY (gratis)</text>
  <line x1="30" y1="175" x2="178" y2="175" stroke="#45475a" stroke-width="1"/>
  <text x="104" y="191" fill="#f9e2af" font-size="9" text-anchor="middle">Cuándo usarlo</text>
  <text x="38" y="206" fill="#cdd6f4" font-size="8">Casi siempre — es el</text>
  <text x="38" y="218" fill="#cdd6f4" font-size="8">tipo por defecto</text>
  <text x="38" y="235" fill="#cdd6f4" font-size="8">FKs, timestamps,</text>
  <text x="38" y="247" fill="#cdd6f4" font-size="8">emails, IDs, precios</text>
  <line x1="30" y1="258" x2="178" y2="258" stroke="#45475a" stroke-width="1"/>
  <text x="104" y="273" fill="#89b4fa" font-size="8" text-anchor="middle">Tamaño: mediano</text>
  <text x="104" y="286" fill="#89b4fa" font-size="8" text-anchor="middle">Escritura: rápida</text>
  <text x="104" y="299" fill="#89b4fa" font-size="8" text-anchor="middle">Lectura: O(log n)</text>

  <!-- ─── HASH ─── -->
  <rect x="200" y="50" width="168" height="290" rx="8" fill="#313244"/>
  <rect x="200" y="50" width="168" height="24" rx="8" fill="#cba6f7"/>
  <text x="284" y="67" fill="#1e1e2e" font-size="11" font-weight="700" text-anchor="middle">Hash</text>
  <rect x="210" y="82" width="148" height="248" rx="5" fill="#181825"/>
  <text x="284" y="99" fill="#cba6f7" font-size="9" font-weight="700" text-anchor="middle">Operadores</text>
  <text x="218" y="114" fill="#a6e3a1" font-size="9">Solo  =</text>
  <text x="218" y="127" fill="#f38ba8" font-size="9">❌ Rangos: no</text>
  <text x="218" y="140" fill="#f38ba8" font-size="9">❌ ORDER BY: no</text>
  <text x="218" y="153" fill="#f38ba8" font-size="9">❌ LIKE: no</text>
  <line x1="210" y1="162" x2="358" y2="162" stroke="#45475a" stroke-width="1"/>
  <text x="284" y="178" fill="#f9e2af" font-size="9" text-anchor="middle">Cuándo usarlo</text>
  <text x="218" y="194" fill="#cdd6f4" font-size="8">Igualdad pura en</text>
  <text x="218" y="206" fill="#cdd6f4" font-size="8">tokens / UUIDs largos</text>
  <text x="218" y="222" fill="#cdd6f4" font-size="8">Cuando B-tree no</text>
  <text x="218" y="234" fill="#cdd6f4" font-size="8">satisface el SLA</text>
  <line x1="210" y1="245" x2="358" y2="245" stroke="#45475a" stroke-width="1"/>
  <text x="284" y="260" fill="#cba6f7" font-size="8" text-anchor="middle">Tamaño: pequeño</text>
  <text x="284" y="273" fill="#cba6f7" font-size="8" text-anchor="middle">Escritura: rápida</text>
  <text x="284" y="286" fill="#cba6f7" font-size="8" text-anchor="middle">Lectura: O(1)</text>
  <text x="284" y="303" fill="#45475a" font-size="8" text-anchor="middle">En práctica: raramente</text>
  <text x="284" y="315" fill="#45475a" font-size="8" text-anchor="middle">necesario sobre B-tree</text>

  <!-- ─── GIN ─── -->
  <rect x="380" y="50" width="168" height="290" rx="8" fill="#313244"/>
  <rect x="380" y="50" width="168" height="24" rx="8" fill="#a6e3a1"/>
  <text x="464" y="67" fill="#1e1e2e" font-size="11" font-weight="700" text-anchor="middle">GIN</text>
  <rect x="390" y="82" width="148" height="248" rx="5" fill="#181825"/>
  <text x="464" y="99" fill="#a6e3a1" font-size="9" font-weight="700" text-anchor="middle">Operadores</text>
  <text x="398" y="114" fill="#a6e3a1" font-size="9">JSONB: @&gt;  ?  ?|  ?&amp;</text>
  <text x="398" y="127" fill="#a6e3a1" font-size="9">Arrays: @&gt;  &lt;@  &amp;&amp;</text>
  <text x="398" y="140" fill="#a6e3a1" font-size="9">FTS: @@</text>
  <line x1="390" y1="150" x2="538" y2="150" stroke="#45475a" stroke-width="1"/>
  <text x="464" y="166" fill="#f9e2af" font-size="9" text-anchor="middle">Cuándo usarlo</text>
  <text x="398" y="182" fill="#cdd6f4" font-size="8">Columnas JSONB con</text>
  <text x="398" y="194" fill="#cdd6f4" font-size="8">búsquedas de contenido</text>
  <text x="398" y="210" fill="#cdd6f4" font-size="8">Arrays de etiquetas o</text>
  <text x="398" y="222" fill="#cdd6f4" font-size="8">categorías</text>
  <text x="398" y="236" fill="#cdd6f4" font-size="8">Búsqueda de texto completo</text>
  <line x1="390" y1="247" x2="538" y2="247" stroke="#45475a" stroke-width="1"/>
  <text x="464" y="263" fill="#f38ba8" font-size="8" text-anchor="middle">Tamaño: grande</text>
  <text x="464" y="276" fill="#f38ba8" font-size="8" text-anchor="middle">Escritura: lenta</text>
  <text x="464" y="289" fill="#a6e3a1" font-size="8" text-anchor="middle">Lectura: muy rápida</text>
  <text x="464" y="305" fill="#45475a" font-size="8" text-anchor="middle">Usar USING GIN</text>
  <text x="464" y="317" fill="#45475a" font-size="8" text-anchor="middle">explícito en CREATE INDEX</text>

  <!-- ─── BRIN ─── -->
  <rect x="560" y="50" width="168" height="290" rx="8" fill="#313244"/>
  <rect x="560" y="50" width="168" height="24" rx="8" fill="#f9e2af"/>
  <text x="644" y="67" fill="#1e1e2e" font-size="11" font-weight="700" text-anchor="middle">BRIN</text>
  <rect x="570" y="82" width="148" height="248" rx="5" fill="#181825"/>
  <text x="644" y="99" fill="#f9e2af" font-size="9" font-weight="700" text-anchor="middle">Operadores</text>
  <text x="578" y="114" fill="#a6e3a1" font-size="9">=  &lt;  &gt;  BETWEEN</text>
  <text x="578" y="127" fill="#f9e2af" font-size="9">Solo si datos ORDENADOS</text>
  <text x="578" y="140" fill="#f9e2af" font-size="9">físicamente en la tabla</text>
  <line x1="570" y1="150" x2="718" y2="150" stroke="#45475a" stroke-width="1"/>
  <text x="644" y="166" fill="#f9e2af" font-size="9" text-anchor="middle">Cuándo usarlo</text>
  <text x="578" y="182" fill="#cdd6f4" font-size="8">created_at en tablas</text>
  <text x="578" y="194" fill="#cdd6f4" font-size="8">de logs/eventos</text>
  <text x="578" y="210" fill="#cdd6f4" font-size="8">Tablas de auditoría</text>
  <text x="578" y="222" fill="#cdd6f4" font-size="8">de millones de filas</text>
  <line x1="570" y1="234" x2="718" y2="234" stroke="#45475a" stroke-width="1"/>
  <text x="644" y="250" fill="#a6e3a1" font-size="8" text-anchor="middle">Tamaño: muy pequeño</text>
  <text x="644" y="263" fill="#a6e3a1" font-size="8" text-anchor="middle">Escritura: muy rápida</text>
  <text x="644" y="276" fill="#cdd6f4" font-size="8" text-anchor="middle">Lectura: moderada</text>
  <text x="578" y="296" fill="#f38ba8" font-size="8">❌ Inútil si los datos</text>
  <text x="578" y="308" fill="#f38ba8" font-size="8">se insertan aleatoriamente</text>

  <!-- ─── GiST ─── -->
  <rect x="740" y="50" width="160" height="290" rx="8" fill="#313244"/>
  <rect x="740" y="50" width="160" height="24" rx="8" fill="#f38ba8"/>
  <text x="820" y="67" fill="#1e1e2e" font-size="11" font-weight="700" text-anchor="middle">GiST</text>
  <rect x="750" y="82" width="140" height="248" rx="5" fill="#181825"/>
  <text x="820" y="99" fill="#f38ba8" font-size="9" font-weight="700" text-anchor="middle">Operadores</text>
  <text x="758" y="114" fill="#a6e3a1" font-size="9">Rangos: &amp;&amp;  @&gt;  &lt;@</text>
  <text x="758" y="127" fill="#a6e3a1" font-size="9">Geometría (PostGIS)</text>
  <text x="758" y="140" fill="#a6e3a1" font-size="9">tsvector (FTS)</text>
  <line x1="750" y1="150" x2="890" y2="150" stroke="#45475a" stroke-width="1"/>
  <text x="820" y="166" fill="#f9e2af" font-size="9" text-anchor="middle">Cuándo usarlo</text>
  <text x="758" y="182" fill="#cdd6f4" font-size="8">EXCLUDE USING GIST</text>
  <text x="758" y="194" fill="#cdd6f4" font-size="8">para no solapamiento</text>
  <text x="758" y="208" fill="#cdd6f4" font-size="8">DATERANGE/TSTZRANGE</text>
  <text x="758" y="220" fill="#cdd6f4" font-size="8">Reservas, turnos</text>
  <line x1="750" y1="232" x2="890" y2="232" stroke="#45475a" stroke-width="1"/>
  <text x="820" y="248" fill="#cdd6f4" font-size="8" text-anchor="middle">Tamaño: mediano</text>
  <text x="820" y="261" fill="#cdd6f4" font-size="8" text-anchor="middle">Escritura: moderada</text>
  <text x="820" y="274" fill="#cdd6f4" font-size="8" text-anchor="middle">Lectura: rápida</text>
  <text x="758" y="294" fill="#cba6f7" font-size="8">PostGIS usa GiST</text>
  <text x="758" y="306" fill="#cba6f7" font-size="8">para coordenadas GPS</text>

  <!-- ─── DECISION STRIP ─── -->
  <rect x="20" y="355" width="880" height="55" rx="8" fill="#313244"/>
  <rect x="20" y="355" width="880" height="22" rx="8" fill="#45475a"/>
  <text x="460" y="370" fill="#cdd6f4" font-size="10" font-weight="700" text-anchor="middle">Árbol de Decisión</text>
  <text x="60"  y="390" fill="#89b4fa" font-size="9">= / &lt; / &gt; / ORDER BY → B-tree</text>
  <text x="230" y="390" fill="#cba6f7" font-size="9">Solo = en texto largo → Hash</text>
  <text x="400" y="390" fill="#a6e3a1" font-size="9">JSONB / arrays / FTS → GIN</text>
  <text x="580" y="390" fill="#f9e2af" font-size="9">Timestamps secuenciales → BRIN</text>
  <text x="760" y="390" fill="#f38ba8" font-size="9">Rangos / solapamiento → GiST</text>
  <text x="60"  y="403" fill="#45475a" font-size="8">(por defecto)</text>
  <text x="230" y="403" fill="#45475a" font-size="8">(micro-opt.)</text>
  <text x="400" y="403" fill="#45475a" font-size="8">(USING GIN)</text>
  <text x="580" y="403" fill="#45475a" font-size="8">(USING BRIN)</text>
  <text x="760" y="403" fill="#45475a" font-size="8">(USING GIST)</text>
</svg>
