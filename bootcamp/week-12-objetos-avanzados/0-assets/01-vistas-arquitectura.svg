<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="480" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="36" fill="#cdd6f4" font-size="18" font-weight="700" text-anchor="middle">Arquitectura de Vistas en PostgreSQL</text>
  <text x="460" y="56" fill="#6c7086" font-size="13" text-anchor="middle">Vista simple vs Vista materializada</text>

  <!-- ─── LEFT COLUMN: Vista Simple ─── -->
  <text x="230" y="90" fill="#89b4fa" font-size="14" font-weight="600" text-anchor="middle">Vista Simple</text>

  <!-- App box -->
  <rect x="130" y="100" width="200" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="230" y="125" fill="#cdd6f4" font-size="13" text-anchor="middle">Aplicación / Consulta</text>

  <!-- Arrow down to view -->
  <line x1="230" y1="140" x2="230" y2="175" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="225,172 235,172 230,180" fill="#6c7086"/>

  <!-- View box -->
  <rect x="100" y="180" width="260" height="50" rx="6" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2"/>
  <text x="230" y="199" fill="#89b4fa" font-size="12" font-weight="600" text-anchor="middle">CREATE VIEW vw_orders_summary</text>
  <text x="230" y="218" fill="#6c7086" font-size="11" text-anchor="middle">SELECT ... FROM orders JOIN customers</text>

  <!-- Arrow down to table -->
  <line x1="230" y1="230" x2="230" y2="265" stroke="#6c7086" stroke-width="1.5"/>
  <polygon points="225,262 235,262 230,270" fill="#6c7086"/>

  <!-- Base tables for simple view -->
  <rect x="100" y="270" width="115" height="38" rx="5" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="157" y="284" fill="#a6e3a1" font-size="11" font-weight="600" text-anchor="middle">orders</text>
  <text x="157" y="300" fill="#6c7086" font-size="10" text-anchor="middle">tabla base</text>

  <rect x="245" y="270" width="115" height="38" rx="5" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="302" y="284" fill="#a6e3a1" font-size="11" font-weight="600" text-anchor="middle">customers</text>
  <text x="302" y="300" fill="#6c7086" font-size="10" text-anchor="middle">tabla base</text>

  <!-- Simple view callout -->
  <rect x="80" y="335" width="300" height="54" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="230" y="354" fill="#f9e2af" font-size="11" font-weight="600" text-anchor="middle">Vista = consulta guardada</text>
  <text x="230" y="370" fill="#6c7086" font-size="10" text-anchor="middle">No almacena datos. Cada SELECT re-ejecuta</text>
  <text x="230" y="384" fill="#6c7086" font-size="10" text-anchor="middle">la query. Siempre datos en tiempo real.</text>

  <!-- WITH CHECK OPTION note -->
  <rect x="80" y="402" width="300" height="36" rx="5" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1"/>
  <text x="230" y="418" fill="#cba6f7" font-size="10" font-weight="600" text-anchor="middle">WITH CHECK OPTION</text>
  <text x="230" y="432" fill="#6c7086" font-size="10" text-anchor="middle">Evita UPDATE que saque filas del WHERE de la vista</text>

  <!-- ─── DIVIDER ─── -->
  <line x1="460" y1="80" x2="460" y2="460" stroke="#45475a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ─── RIGHT COLUMN: Vista Materializada ─── -->
  <text x="690" y="90" fill="#89b4fa" font-size="14" font-weight="600" text-anchor="middle">Vista Materializada</text>

  <!-- App box -->
  <rect x="590" y="100" width="200" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="690" y="125" fill="#cdd6f4" font-size="13" text-anchor="middle">Aplicación / Consulta</text>

  <!-- Arrow down to matview -->
  <line x1="690" y1="140" x2="690" y2="175" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="685,172 695,172 690,180" fill="#6c7086"/>

  <!-- Materialized view box (solid — has data) -->
  <rect x="555" y="180" width="270" height="50" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="690" y="199" fill="#a6e3a1" font-size="12" font-weight="600" text-anchor="middle">MATERIALIZED VIEW mvw_monthly_sales</text>
  <text x="690" y="218" fill="#6c7086" font-size="11" text-anchor="middle">snapshot en disco — lectura instantánea</text>

  <!-- Arrow down to base table (REFRESH path) -->
  <line x1="690" y1="270" x2="690" y2="230" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="685,233 695,233 690,225" fill="#f38ba8"/>
  <text x="730" y="257" fill="#f38ba8" font-size="10">REFRESH</text>

  <!-- Base table for matview -->
  <rect x="575" y="270" width="230" height="38" rx="5" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="690" y="284" fill="#a6e3a1" font-size="11" font-weight="600" text-anchor="middle">orders</text>
  <text x="690" y="300" fill="#6c7086" font-size="10" text-anchor="middle">tabla base (datos siempre en tiempo real)</text>

  <!-- Matview callout -->
  <rect x="540" y="335" width="300" height="54" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="690" y="354" fill="#f9e2af" font-size="11" font-weight="600" text-anchor="middle">Vista materializada = snapshot en disco</text>
  <text x="690" y="370" fill="#6c7086" font-size="10" text-anchor="middle">Almacena datos. Lectura muy rápida.</text>
  <text x="690" y="384" fill="#6c7086" font-size="10" text-anchor="middle">Requiere REFRESH para actualizar.</text>

  <!-- CONCURRENTLY note -->
  <rect x="540" y="402" width="300" height="36" rx="5" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
  <text x="690" y="418" fill="#89b4fa" font-size="10" font-weight="600" text-anchor="middle">REFRESH MATERIALIZED VIEW CONCURRENTLY</text>
  <text x="690" y="432" fill="#6c7086" font-size="10" text-anchor="middle">No bloquea lecturas. Requiere UNIQUE index.</text>

  <!-- Bottom legend -->
  <rect x="20" y="455" width="880" height="18" rx="3" fill="#181825"/>
  <rect x="30" y="460" width="12" height="8" rx="2" fill="#89b4fa"/>
  <text x="48" y="469" fill="#6c7086" font-size="10">Sin datos propios (vista simple)</text>
  <rect x="200" y="460" width="12" height="8" rx="2" fill="#a6e3a1"/>
  <text x="218" y="469" fill="#6c7086" font-size="10">Con datos en disco (mat. view)</text>
  <rect x="400" y="460" width="12" height="8" rx="2" fill="#cba6f7"/>
  <text x="418" y="469" fill="#6c7086" font-size="10">WITH CHECK OPTION</text>
  <rect x="580" y="460" width="12" height="8" rx="2" fill="#f38ba8"/>
  <text x="598" y="469" fill="#6c7086" font-size="10">REFRESH (actualización manual)</text>
</svg>
