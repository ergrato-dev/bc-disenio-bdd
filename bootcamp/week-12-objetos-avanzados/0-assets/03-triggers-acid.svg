<svg viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="500" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="32" fill="#cdd6f4" font-size="18" font-weight="700" text-anchor="middle">Triggers y Propiedades ACID</text>
  <text x="460" y="52" fill="#6c7086" font-size="13" text-anchor="middle">Flujo de ejecución de un trigger · Garantías ACID en PostgreSQL</text>

  <!-- ─── DIVIDER ─── -->
  <line x1="460" y1="65" x2="460" y2="470" stroke="#45475a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ═══ LEFT: Trigger execution flow ═══ -->
  <text x="230" y="80" fill="#89b4fa" font-size="13" font-weight="600" text-anchor="middle">Flujo de ejecución de un Trigger</text>

  <!-- DML Event -->
  <rect x="80" y="92" width="300" height="36" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="230" y="116" fill="#89b4fa" font-size="12" font-weight="600" text-anchor="middle">Evento DML: INSERT / UPDATE / DELETE</text>

  <!-- Arrow -->
  <line x1="230" y1="128" x2="230" y2="145" stroke="#6c7086" stroke-width="1.5"/>
  <polygon points="225,143 235,143 230,150" fill="#6c7086"/>

  <!-- BEFORE Trigger box -->
  <rect x="80" y="150" width="300" height="56" rx="6" fill="#2a1a3e" stroke="#cba6f7" stroke-width="2"/>
  <text x="230" y="170" fill="#cba6f7" font-size="12" font-weight="700" text-anchor="middle">BEFORE Trigger</text>
  <text x="230" y="187" fill="#cdd6f4" font-size="11" text-anchor="middle">Puede modificar NEW · retornar NEW modificado</text>
  <text x="230" y="202" fill="#f38ba8" font-size="11" text-anchor="middle">Retornar NULL = cancelar la operación</text>

  <!-- Arrow -->
  <line x1="230" y1="206" x2="230" y2="223" stroke="#6c7086" stroke-width="1.5"/>
  <polygon points="225,221 235,221 230,228" fill="#6c7086"/>

  <!-- Heap Write -->
  <rect x="80" y="228" width="300" height="36" rx="6" fill="#1a2a1a" stroke="#a6e3a1" stroke-width="2"/>
  <text x="230" y="252" fill="#a6e3a1" font-size="12" font-weight="700" text-anchor="middle">Escritura en la tabla (heap write)</text>

  <!-- Arrow -->
  <line x1="230" y1="264" x2="230" y2="281" stroke="#6c7086" stroke-width="1.5"/>
  <polygon points="225,279 235,279 230,286" fill="#6c7086"/>

  <!-- AFTER Trigger box -->
  <rect x="80" y="286" width="300" height="56" rx="6" fill="#1e3a5f" stroke="#89b4fa" stroke-width="2"/>
  <text x="230" y="306" fill="#89b4fa" font-size="12" font-weight="700" text-anchor="middle">AFTER Trigger</text>
  <text x="230" y="323" fill="#cdd6f4" font-size="11" text-anchor="middle">Cambio ya en la tabla. NEW y OLD disponibles.</text>
  <text x="230" y="338" fill="#f9e2af" font-size="11" text-anchor="middle">Usado para auditoría, notificaciones</text>

  <!-- Arrow to audit log -->
  <line x1="230" y1="342" x2="230" y2="358" stroke="#6c7086" stroke-width="1.5"/>
  <polygon points="225,356 235,356 230,363" fill="#6c7086"/>

  <!-- Audit log table -->
  <rect x="80" y="363" width="300" height="36" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="230" y="387" fill="#f9e2af" font-size="12" text-anchor="middle">audit_log — INSERT automático</text>

  <!-- INSTEAD OF note -->
  <rect x="80" y="415" width="300" height="46" rx="6" fill="#181825" stroke="#6c7086" stroke-width="1"/>
  <text x="230" y="432" fill="#f9e2af" font-size="11" font-weight="600" text-anchor="middle">INSTEAD OF (solo en vistas)</text>
  <text x="230" y="448" fill="#6c7086" font-size="10" text-anchor="middle">Reemplaza el DML completamente.</text>
  <text x="230" y="460" fill="#6c7086" font-size="10" text-anchor="middle">Permite INSERT/UPDATE en vistas no actualizables.</text>

  <!-- ═══ RIGHT: ACID cards ═══ -->
  <text x="690" y="80" fill="#89b4fa" font-size="13" font-weight="600" text-anchor="middle">Propiedades ACID en PostgreSQL</text>

  <!-- A card -->
  <rect x="480" y="92" width="420" height="88" rx="6" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <rect x="480" y="92" width="44" height="88" rx="6" fill="#89b4fa"/>
  <text x="502" y="145" fill="#1e1e2e" font-size="26" font-weight="900" text-anchor="middle">A</text>
  <text x="540" y="113" fill="#89b4fa" font-size="13" font-weight="700">Atomicity — Atomicidad</text>
  <text x="540" y="131" fill="#cdd6f4" font-size="11">Todo o nada: si una operación falla,</text>
  <text x="540" y="147" fill="#cdd6f4" font-size="11">se deshacen todos los cambios.</text>
  <text x="540" y="163" fill="#a6e3a1" font-size="11" font-family="monospace">BEGIN ... COMMIT / ROLLBACK</text>

  <!-- C card -->
  <rect x="480" y="192" width="420" height="88" rx="6" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <rect x="480" y="192" width="44" height="88" rx="6" fill="#a6e3a1"/>
  <text x="502" y="245" fill="#1e1e2e" font-size="26" font-weight="900" text-anchor="middle">C</text>
  <text x="540" y="213" fill="#a6e3a1" font-size="13" font-weight="700">Consistency — Consistencia</text>
  <text x="540" y="231" fill="#cdd6f4" font-size="11">La BD siempre pasa de un estado</text>
  <text x="540" y="247" fill="#cdd6f4" font-size="11">válido a otro estado válido.</text>
  <text x="540" y="263" fill="#a6e3a1" font-size="11" font-family="monospace">Constraints, triggers, CHECK</text>

  <!-- I card -->
  <rect x="480" y="292" width="420" height="88" rx="6" fill="#181825" stroke="#f9e2af" stroke-width="1.5"/>
  <rect x="480" y="292" width="44" height="88" rx="6" fill="#f9e2af"/>
  <text x="502" y="345" fill="#1e1e2e" font-size="26" font-weight="900" text-anchor="middle">I</text>
  <text x="540" y="313" fill="#f9e2af" font-size="13" font-weight="700">Isolation — Aislamiento</text>
  <text x="540" y="331" fill="#cdd6f4" font-size="11">Las transacciones concurrentes no se ven</text>
  <text x="540" y="347" fill="#cdd6f4" font-size="11">entre sí hasta el COMMIT.</text>
  <text x="540" y="363" fill="#f9e2af" font-size="11" font-family="monospace">READ COMMITTED (default), SERIALIZABLE</text>

  <!-- D card -->
  <rect x="480" y="392" width="420" height="78" rx="6" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  <rect x="480" y="392" width="44" height="78" rx="6" fill="#f38ba8"/>
  <text x="502" y="440" fill="#1e1e2e" font-size="26" font-weight="900" text-anchor="middle">D</text>
  <text x="540" y="413" fill="#f38ba8" font-size="13" font-weight="700">Durability — Durabilidad</text>
  <text x="540" y="431" fill="#cdd6f4" font-size="11">Los cambios confirmados sobreviven</text>
  <text x="540" y="447" fill="#cdd6f4" font-size="11">a caídas del sistema o reinicios.</text>
  <text x="540" y="463" fill="#f38ba8" font-size="11" font-family="monospace">WAL (Write-Ahead Log)</text>
</svg>
