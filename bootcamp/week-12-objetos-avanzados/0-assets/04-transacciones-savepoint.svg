<svg viewBox="0 0 920 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="380" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="32" fill="#cdd6f4" font-size="18" font-weight="700" text-anchor="middle">Transacciones y SAVEPOINT en PostgreSQL</text>
  <text x="460" y="52" fill="#6c7086" font-size="13" text-anchor="middle">BEGIN → SAVEPOINT → ROLLBACK TO → COMMIT</text>

  <!-- ─── Timeline rail ─── -->
  <line x1="40" y1="160" x2="880" y2="160" stroke="#45475a" stroke-width="2"/>

  <!-- ─── Events on timeline ─── -->

  <!-- BEGIN -->
  <circle cx="60" cy="160" r="10" fill="#89b4fa"/>
  <text x="60" y="198" fill="#89b4fa" font-size="11" font-weight="700" text-anchor="middle">BEGIN</text>
  <text x="60" y="214" fill="#6c7086" font-size="10" text-anchor="middle">t0</text>

  <!-- INSERT order -->
  <circle cx="170" cy="160" r="10" fill="#a6e3a1"/>
  <text x="170" y="198" fill="#a6e3a1" font-size="11" text-anchor="middle">INSERT</text>
  <text x="170" y="212" fill="#6c7086" font-size="10" text-anchor="middle">orders</text>
  <line x1="170" y1="148" x2="170" y2="80" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="110" y="62" width="120" height="24" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1"/>
  <text x="170" y="78" fill="#a6e3a1" font-size="10" text-anchor="middle">Nueva orden creada ✓</text>

  <!-- SAVEPOINT sp1 -->
  <polygon points="290,148 310,148 300,165" fill="#f9e2af"/>
  <polygon points="290,172 310,172 300,155" fill="#f9e2af"/>
  <text x="300" y="198" fill="#f9e2af" font-size="11" font-weight="700" text-anchor="middle">SAVEPOINT</text>
  <text x="300" y="212" fill="#f9e2af" font-size="10" text-anchor="middle">sp1</text>
  <line x1="300" y1="148" x2="300" y2="80" stroke="#f9e2af" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="240" y="62" width="120" height="24" rx="4" fill="#181825" stroke="#f9e2af" stroke-width="1"/>
  <text x="300" y="78" fill="#f9e2af" font-size="10" text-anchor="middle">Punto de guardado sp1</text>

  <!-- UPDATE coupon (will be rolled back) -->
  <circle cx="420" cy="160" r="10" fill="#f38ba8"/>
  <text x="420" y="198" fill="#f38ba8" font-size="11" text-anchor="middle">UPDATE</text>
  <text x="420" y="212" fill="#6c7086" font-size="10" text-anchor="middle">coupons</text>
  <line x1="420" y1="148" x2="420" y2="80" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="352" y="62" width="136" height="24" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="1"/>
  <text x="420" y="78" fill="#f38ba8" font-size="10" text-anchor="middle">Cupón inválido — fallará</text>

  <!-- SAVEPOINT sp2 (also rolled back) -->
  <polygon points="530,148 550,148 540,165" fill="#f9e2af" opacity="0.5"/>
  <polygon points="530,172 550,172 540,155" fill="#f9e2af" opacity="0.5"/>
  <text x="540" y="198" fill="#f9e2af" font-size="11" font-weight="700" text-anchor="middle" opacity="0.6">SAVEPOINT</text>
  <text x="540" y="212" fill="#f9e2af" font-size="10" text-anchor="middle" opacity="0.6">sp2</text>

  <!-- ROLLBACK TO sp1 -->
  <path d="M 660 155 Q 520 110 315 155" stroke="#f38ba8" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <polygon points="315,151 315,160 308,155" fill="#f38ba8"/>
  <text x="480" y="115" fill="#f38ba8" font-size="11" font-weight="700" text-anchor="middle">ROLLBACK TO SAVEPOINT sp1</text>
  <text x="480" y="130" fill="#6c7086" font-size="10" text-anchor="middle">Deshace UPDATE + SAVEPOINT sp2. Conserva INSERT.</text>

  <!-- INSERT order_items (after rollback, fresh) -->
  <circle cx="750" cy="160" r="10" fill="#a6e3a1"/>
  <text x="750" y="198" fill="#a6e3a1" font-size="11" text-anchor="middle">INSERT</text>
  <text x="750" y="212" fill="#6c7086" font-size="10" text-anchor="middle">order_items</text>
  <line x1="750" y1="148" x2="750" y2="80" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="682" y="62" width="136" height="24" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1"/>
  <text x="750" y="78" fill="#a6e3a1" font-size="10" text-anchor="middle">Ítems de la orden ✓</text>

  <!-- COMMIT -->
  <circle cx="870" cy="160" r="10" fill="#89b4fa"/>
  <text x="870" y="198" fill="#89b4fa" font-size="11" font-weight="700" text-anchor="middle">COMMIT</text>
  <text x="870" y="214" fill="#6c7086" font-size="10" text-anchor="middle">tn</text>

  <!-- ─── State on disk (below) ─── -->
  <text x="460" y="252" fill="#6c7086" font-size="12" font-weight="600" text-anchor="middle">Estado final en la base de datos</text>

  <rect x="40" y="262" width="200" height="50" rx="6" fill="#1a2a1a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="140" y="282" fill="#a6e3a1" font-size="11" font-weight="600" text-anchor="middle">orders INSERT ✓</text>
  <text x="140" y="298" fill="#6c7086" font-size="10" text-anchor="middle">Confirmado en COMMIT</text>
  <text x="140" y="310" fill="#6c7086" font-size="10" text-anchor="middle">Permanece en la BD</text>

  <rect x="260" y="262" width="200" height="50" rx="6" fill="#2a0a0a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="360" y="282" fill="#f38ba8" font-size="11" font-weight="600" text-anchor="middle">coupons UPDATE ✗</text>
  <text x="360" y="298" fill="#6c7086" font-size="10" text-anchor="middle">Deshecho en ROLLBACK TO sp1</text>
  <text x="360" y="310" fill="#6c7086" font-size="10" text-anchor="middle">No llegó al disco</text>

  <rect x="480" y="262" width="200" height="50" rx="6" fill="#2d1c00" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="580" y="282" fill="#f9e2af" font-size="11" font-weight="600" text-anchor="middle">SAVEPOINT sp2 ✗</text>
  <text x="580" y="298" fill="#6c7086" font-size="10" text-anchor="middle">Eliminado al hacer ROLLBACK</text>
  <text x="580" y="310" fill="#6c7086" font-size="10" text-anchor="middle">TO SAVEPOINT sp1</text>

  <rect x="700" y="262" width="200" height="50" rx="6" fill="#1a2a1a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="800" y="282" fill="#a6e3a1" font-size="11" font-weight="600" text-anchor="middle">order_items INSERT ✓</text>
  <text x="800" y="298" fill="#6c7086" font-size="10" text-anchor="middle">Confirmado en COMMIT</text>
  <text x="800" y="310" fill="#6c7086" font-size="10" text-anchor="middle">Permanece en la BD</text>

  <!-- Legend -->
  <rect x="40" y="330" width="840" height="32" rx="4" fill="#181825"/>
  <circle cx="65" cy="346" r="7" fill="#a6e3a1"/>
  <text x="80" y="350" fill="#6c7086" font-size="10">Confirmado</text>
  <circle cx="175" cy="346" r="7" fill="#f38ba8"/>
  <text x="190" y="350" fill="#6c7086" font-size="10">Deshecho por ROLLBACK TO</text>
  <polygon points="355,339 375,339 365,356" fill="#f9e2af"/>
  <text x="383" y="350" fill="#6c7086" font-size="10">SAVEPOINT (marcador)</text>
  <circle cx="530" cy="346" r="7" fill="#89b4fa"/>
  <text x="545" y="350" fill="#6c7086" font-size="10">BEGIN / COMMIT</text>
  <text x="680" y="350" fill="#6c7086" font-size="10">RELEASE SAVEPOINT → descarta el marcador sin deshacer</text>
</svg>
