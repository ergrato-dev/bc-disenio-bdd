<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="480" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="460" y="32" fill="#cdd6f4" font-size="18" font-weight="700" text-anchor="middle">Niveles de Auditoría en PostgreSQL</text>
  <text x="460" y="52" fill="#6c7086" font-size="13" text-anchor="middle">Desde metadatos básicos hasta historia completa de cambios</text>

  <!-- ─── 3 Column headers ─── -->

  <!-- Level 1 -->
  <rect x="20" y="65" width="272" height="34" rx="6" fill="#1e3a5f" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="156" y="87" fill="#89b4fa" font-size="12" font-weight="700" text-anchor="middle">Nivel 1 — Metadatos de Tiempo</text>

  <!-- Level 2 -->
  <rect x="324" y="65" width="272" height="34" rx="6" fill="#2a1a3e" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="460" y="87" fill="#cba6f7" font-size="12" font-weight="700" text-anchor="middle">Nivel 2 — Autoría</text>

  <!-- Level 3 -->
  <rect x="628" y="65" width="272" height="34" rx="6" fill="#1a2a1a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="764" y="87" fill="#a6e3a1" font-size="12" font-weight="700" text-anchor="middle">Nivel 3 — Historia Completa</text>

  <!-- ─── Level 1 card ─── -->
  <rect x="20" y="107" width="272" height="160" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="36" y="130" fill="#89b4fa" font-size="11" font-weight="600">Columnas en la tabla:</text>
  <text x="36" y="150" fill="#a6e3a1" font-size="11" font-family="monospace">created_at  TIMESTAMPTZ</text>
  <text x="36" y="166" fill="#a6e3a1" font-size="11" font-family="monospace">updated_at  TIMESTAMPTZ</text>
  <text x="36" y="182" fill="#f38ba8" font-size="11" font-family="monospace">deleted_at  TIMESTAMPTZ</text>
  <text x="36" y="202" fill="#6c7086" font-size="10">¿Cuándo se creó/modificó/eliminó?</text>
  <text x="36" y="218" fill="#f9e2af" font-size="10">Se mantiene con trigger BEFORE UPDATE</text>
  <text x="36" y="234" fill="#f9e2af" font-size="10">que asigna updated_at = NOW()</text>
  <text x="36" y="252" fill="#6c7086" font-size="10">Costo: 3 columnas extra por tabla</text>

  <!-- ─── Level 2 card ─── -->
  <rect x="324" y="107" width="272" height="160" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="340" y="130" fill="#cba6f7" font-size="11" font-weight="600">Columnas adicionales:</text>
  <text x="340" y="150" fill="#cba6f7" font-size="11" font-family="monospace">created_by  UUID  →  users</text>
  <text x="340" y="166" fill="#cba6f7" font-size="11" font-family="monospace">updated_by  UUID  →  users</text>
  <text x="340" y="186" fill="#6c7086" font-size="10">¿Quién hizo el cambio?</text>
  <text x="340" y="202" fill="#f9e2af" font-size="10">La app configura:</text>
  <text x="340" y="218" fill="#f9e2af" font-size="10" font-family="monospace">SET LOCAL app.current_user_id</text>
  <text x="340" y="234" fill="#f9e2af" font-size="10" font-family="monospace">   = '...uuid...';</text>
  <text x="340" y="252" fill="#6c7086" font-size="10">Trigger lee current_setting()</text>

  <!-- ─── Level 3 card ─── -->
  <rect x="628" y="107" width="272" height="160" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="644" y="130" fill="#a6e3a1" font-size="11" font-weight="600">Tabla separada: products_history</text>
  <text x="644" y="150" fill="#a6e3a1" font-size="11" font-family="monospace">history_id        UUID PK</text>
  <text x="644" y="166" fill="#a6e3a1" font-size="11" font-family="monospace">history_operation TEXT</text>
  <text x="644" y="182" fill="#a6e3a1" font-size="11" font-family="monospace">history_changed_at TIMESTAMPTZ</text>
  <text x="644" y="198" fill="#a6e3a1" font-size="11" font-family="monospace">history_changed_by TEXT</text>
  <text x="644" y="214" fill="#6c7086" font-size="10">+ copia de todas las columnas</text>
  <text x="644" y="230" fill="#6c7086" font-size="10">de la tabla original</text>
  <text x="644" y="250" fill="#f9e2af" font-size="10">AFTER trigger → INSERT en history</text>

  <!-- ─── Timeline showing 3 product updates → history ─── -->
  <line x1="20" y1="290" x2="900" y2="290" stroke="#45475a" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="460" y="314" fill="#f9e2af" font-size="13" font-weight="600" text-anchor="middle">Historia completa de un producto → tabla products_history</text>

  <!-- History table header -->
  <rect x="20" y="322" width="880" height="26" rx="4" fill="#313244"/>
  <text x="36" y="339" fill="#6c7086" font-size="10" font-weight="600">history_op</text>
  <text x="130" y="339" fill="#6c7086" font-size="10" font-weight="600">history_changed_at</text>
  <text x="310" y="339" fill="#6c7086" font-size="10" font-weight="600">history_changed_by</text>
  <text x="490" y="339" fill="#6c7086" font-size="10" font-weight="600">product_name</text>
  <text x="640" y="339" fill="#6c7086" font-size="10" font-weight="600">product_price</text>
  <text x="770" y="339" fill="#6c7086" font-size="10" font-weight="600">product_stock</text>

  <!-- Row 1: INSERT -->
  <rect x="20" y="348" width="880" height="24" rx="0" fill="#1a2a1a" stroke="#313244" stroke-width="1"/>
  <text x="36" y="364" fill="#a6e3a1" font-size="10" font-weight="700">INSERT</text>
  <text x="130" y="364" fill="#6c7086" font-size="10">2026-01-10 09:00:00</text>
  <text x="310" y="364" fill="#6c7086" font-size="10">admin_user</text>
  <text x="490" y="364" fill="#cdd6f4" font-size="10">Laptop Pro 15"</text>
  <text x="640" y="364" fill="#cdd6f4" font-size="10">999.00</text>
  <text x="770" y="364" fill="#cdd6f4" font-size="10">50</text>

  <!-- Row 2: UPDATE price -->
  <rect x="20" y="372" width="880" height="24" rx="0" fill="#181825" stroke="#313244" stroke-width="1"/>
  <text x="36" y="388" fill="#89b4fa" font-size="10" font-weight="700">UPDATE</text>
  <text x="130" y="388" fill="#6c7086" font-size="10">2026-02-20 14:30:00</text>
  <text x="310" y="388" fill="#6c7086" font-size="10">sales_manager</text>
  <text x="490" y="388" fill="#cdd6f4" font-size="10">Laptop Pro 15"</text>
  <text x="640" y="388" fill="#f9e2af" font-size="10">879.00 ↓</text>
  <text x="770" y="388" fill="#cdd6f4" font-size="10">50</text>

  <!-- Row 3: UPDATE stock -->
  <rect x="20" y="396" width="880" height="24" rx="0" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
  <text x="36" y="412" fill="#89b4fa" font-size="10" font-weight="700">UPDATE</text>
  <text x="130" y="412" fill="#6c7086" font-size="10">2026-03-05 11:15:00</text>
  <text x="310" y="412" fill="#6c7086" font-size="10">warehouse_op</text>
  <text x="490" y="412" fill="#cdd6f4" font-size="10">Laptop Pro 15"</text>
  <text x="640" y="412" fill="#cdd6f4" font-size="10">879.00</text>
  <text x="770" y="412" fill="#f9e2af" font-size="10">12 ↓</text>

  <!-- Row 4: DELETE -->
  <rect x="20" y="420" width="880" height="24" rx="0" fill="#2a0a0a" stroke="#f38ba8" stroke-width="1"/>
  <text x="36" y="436" fill="#f38ba8" font-size="10" font-weight="700">DELETE</text>
  <text x="130" y="436" fill="#6c7086" font-size="10">2026-04-12 16:45:00</text>
  <text x="310" y="436" fill="#6c7086" font-size="10">admin_user</text>
  <text x="490" y="436" fill="#585b70" font-size="10" text-decoration="line-through">Laptop Pro 15"</text>
  <text x="640" y="436" fill="#585b70" font-size="10" text-decoration="line-through">879.00</text>
  <text x="770" y="436" fill="#585b70" font-size="10" text-decoration="line-through">12</text>

  <!-- Point-in-time callout -->
  <rect x="20" y="454" width="880" height="20" rx="3" fill="#181825"/>
  <text x="460" y="468" fill="#6c7086" font-size="10" text-anchor="middle">Point-in-time query: SELECT * FROM products_history WHERE product_id = '...' AND history_changed_at &lt;= '2026-03-01' ORDER BY history_changed_at DESC LIMIT 1</text>
</svg>
